<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPGAME - Salve a Floresta!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        :root { --font: 'Baloo 2', 'Trebuchet MS', 'Comic Sans MS', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #48cae4; font-family: var(--font); }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* ---------- HUD ---------- */
        #hud {
          position: absolute; top: 0; left: 0; width: 100%;
          display: flex; justify-content: space-between; align-items: flex-start;
          padding: 6px 10px; z-index: 20; pointer-events: none; gap: 8px;
        }
        .hud-left, .hud-center, .hud-right { display: flex; align-items: center; gap: 8px; }
        .hud-center { margin-top: 6px; }

        .logo { position: relative; padding: 2px 6px 0 2px; }
        .logo .title {
          font-weight: 800; font-size: clamp(26px, 6.5vw, 58px); line-height: 1; letter-spacing: 1px;
          color: #ffb703; -webkit-text-stroke: clamp(3px, .6vw, 6px) #7b3f12; paint-order: stroke fill;
          text-shadow: 0 4px 0 #7b3f12, 0 6px 8px rgba(0,0,0,.35);
          background: linear-gradient(#ffe066, #ff9f1c); -webkit-background-clip: text; background-clip: text;
        }
        .logo .title span { display: inline-block; }
        .logo .sub {
          margin-top: -4px; margin-left: clamp(10px, 3vw, 30px); display: inline-block;
          background: linear-gradient(#b9763f, #8a4f26); border: 3px solid #5a3214; border-radius: 10px;
          color: #fff; font-weight: 800; font-size: clamp(10px, 2.3vw, 20px); padding: 0 12px;
          text-shadow: 0 2px 0 #3d210c; box-shadow: 0 3px 0 #3d210c;
        }
        .heart { font-size: clamp(22px, 4.4vw, 40px); filter: drop-shadow(0 3px 0 rgba(120,0,20,.5)); }
        .heart.lost { filter: grayscale(1) brightness(.35) drop-shadow(0 3px 0 rgba(0,0,0,.4)); }

        .pill {
          display: flex; align-items: center; gap: 6px;
          background: rgba(18, 52, 82, 0.88); border: 2px solid #4aa3c7; border-radius: 14px;
          padding: 2px 12px 2px 8px; color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.3);
        }
        .pill .ico { font-size: clamp(22px, 4.5vw, 38px); }
        .pill .txt { display: flex; flex-direction: column; line-height: 1; align-items: center; }
        .pill .lbl { font-size: clamp(10px, 1.8vw, 16px); font-weight: 800; opacity: .95; }
        .pill .val { font-size: clamp(16px, 3.4vw, 32px); font-weight: 800; }

        .sign {
          background: linear-gradient(#c88a4f, #9a5e2d); border: 3px solid #5a3214; border-radius: 8px;
          padding: 2px 12px; color: #fff; font-weight: 800; line-height: 1; text-align: center;
          font-size: clamp(11px, 2.4vw, 22px); text-shadow: 0 2px 0 #3d210c; box-shadow: 0 3px 0 #3d210c;
          display: flex; align-items: center; gap: 6px;
        }
        .sign .ico { font-size: clamp(20px, 4vw, 34px); }
        #btn-pause {
          pointer-events: auto; width: clamp(40px, 6.4vw, 60px); height: clamp(40px, 6.4vw, 60px);
          background: linear-gradient(#ffd23f, #ff9f1c); border: 3px solid #b45f06; border-radius: 14px;
          box-shadow: 0 4px 0 #8a4604, 0 6px 8px rgba(0,0,0,.3);
          display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
        }
        #btn-pause i { display: block; width: 24%; height: 52%; background: #fff; border-radius: 3px; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
        #btn-pause:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a4604; }


        /* ---------- Controles de toque ---------- */
        .touch-controls {
          position: absolute; bottom: 10px; left: 0; width: 100%;
          display: flex; justify-content: space-between; padding: 0 18px;
          pointer-events: none; z-index: 15;
        }
        .dpad, .actions { display: flex; gap: 14px; pointer-events: auto; }
        .t-btn {
          width: clamp(62px, 9vw, 92px); height: clamp(62px, 9vw, 92px); border-radius: 50%;
          background: radial-gradient(circle at 35% 30%, #8cf04a, #3bb82a 70%);
          border: 5px solid #1f8a1f; box-shadow: 0 5px 0 #146414, 0 8px 12px rgba(0,0,0,.3);
          display: flex; align-items: center; justify-content: center; touch-action: none;
        }
        .t-btn svg { width: 48%; height: 48%; filter: drop-shadow(0 3px 0 rgba(0,70,0,.4)); }
        .t-btn:active { transform: translateY(4px) scale(.96); box-shadow: 0 1px 0 #146414; }

        .hidden { display: none !important; }
        #hud { flex-wrap: nowrap; }
        #hud-lives { display: flex; white-space: nowrap; flex-shrink: 0; }
        .hud-center, .hud-right, .pill, .sign { flex-shrink: 0; white-space: nowrap; }
        @media (max-width: 560px) { .hud-center .pill:nth-child(4) { display: none; } }

        /* Celular / telas baixas: HUD compacto para não cobrir o personagem */
        @media (max-height: 520px), (max-width: 700px) {
          #hud { padding: 3px 8px; gap: 6px; }
          .hud-left, .hud-center, .hud-right { gap: 5px; }
          .hud-center { margin-top: 0; }
          #hud .logo .title { font-size: 28px; -webkit-text-stroke: 3px #7b3f12; text-shadow: 0 2px 0 #7b3f12; }
          #hud .logo .sub { display: none; }
          .heart { font-size: 19px; }
          .pill { padding: 0 8px 0 5px; border-width: 2px; border-radius: 10px; background: rgba(18, 52, 82, .78); gap: 4px; }
          .pill .ico { font-size: 19px; }
          .pill .lbl { font-size: 9px; }
          .pill .val { font-size: 15px; }
          .sign { padding: 1px 8px; font-size: 10px; border-width: 2px; }
          .sign .ico { font-size: 17px; }
          #btn-pause { width: 32px; height: 32px; border-width: 2px; border-radius: 9px; gap: 4px; }
        }

        /* ---------- Tela de início ---------- */
        #start {
          position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(ellipse at center, rgba(10,40,70,.10) 0%, rgba(10,40,70,.55) 100%);
        }
        #start.hidden { display: none; }
        body.intro #hud, body.intro .touch-controls { display: none; }
        .start-box { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 18px); text-align: center; padding: 10px; }
        .logo.big .title { font-size: clamp(56px, 15vw, 150px); -webkit-text-stroke: clamp(5px, 1vw, 10px) #7b3f12; text-shadow: 0 6px 0 #7b3f12, 0 10px 14px rgba(0,0,0,.4); }
        .logo.big .sub { font-size: clamp(16px, 3.6vw, 34px); margin-top: -6px; padding: 2px 22px; border-width: 4px; }
        .tagline { color: #fff; font-weight: 800; font-size: clamp(14px, 2.4vw, 22px); text-shadow: 0 2px 0 rgba(0,0,0,.55); }
        .play {
          font-family: var(--font); font-weight: 800; color: #fff; cursor: pointer; letter-spacing: 1px;
          font-size: clamp(24px, 5vw, 44px); padding: 4px clamp(30px, 6vw, 60px);
          background: radial-gradient(circle at 35% 25%, #8cf04a, #3bb82a 75%); border: 5px solid #1f8a1f; border-radius: 22px;
          box-shadow: 0 7px 0 #146414, 0 12px 18px rgba(0,0,0,.35); text-shadow: 0 3px 0 rgba(0,70,0,.55);
          animation: pulse 1.4s ease-in-out infinite;
        }
        .play:active { transform: translateY(5px); box-shadow: 0 2px 0 #146414; animation: none; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        .lvls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; color: #fff; font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,.55); font-size: clamp(13px, 2vw, 18px); }
        .lvls button {
          font-family: var(--font); font-weight: 800; font-size: clamp(13px, 2vw, 18px); color: #fff; cursor: pointer;
          background: linear-gradient(#c88a4f, #9a5e2d); border: 3px solid #5a3214; border-radius: 10px; padding: 1px 12px;
          box-shadow: 0 3px 0 #3d210c; text-shadow: 0 2px 0 #3d210c;
        }
        .lvls button:active { transform: translateY(2px); box-shadow: 0 1px 0 #3d210c; }
        .how { color: #fff; font-weight: 600; font-size: clamp(11px, 1.8vw, 16px); text-shadow: 0 2px 0 rgba(0,0,0,.6); background: rgba(10,30,50,.55); border-radius: 12px; padding: 4px 14px; }

        /* ---------- Ranking ---------- */
        #rank { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(10, 30, 50, .72); overflow: auto; }
        #rank.hidden { display: none; }
        .rank-panel { min-width: min(92vw, 380px); max-width: 92vw; gap: 8px; margin: 10px; }
        .rank-panel h2 { font-size: clamp(22px, 4vw, 30px); }
        #rank-score { color: #ffe066; font-weight: 800; font-size: clamp(18px, 3.4vw, 26px); text-shadow: 0 2px 0 #3d210c; }
        #rank-msg { color: #fff; font-weight: 800; min-height: 1.2em; text-shadow: 0 2px 0 #3d210c; font-size: clamp(13px, 2.2vw, 17px); }
        #rank-form { display: flex; gap: 8px; justify-content: center; align-items: center; }
        #rank-name { font-family: var(--font); font-weight: 800; font-size: 18px; width: min(58vw, 250px); padding: 3px 10px; border-radius: 10px; border: 3px solid #5a3214; background: #fff7e6; color: #3d210c; outline: none; }
        #rank-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        #rank-list li { display: flex; align-items: center; gap: 10px; background: rgba(61, 33, 12, .55); border: 2px solid rgba(255,255,255,.18); border-radius: 12px; padding: 2px 10px; color: #fff; text-align: left; }
        #rank-list li.me { background: linear-gradient(#ffe066, #ffb703); border-color: #b45f06; color: #3d210c; }
        #rank-list li.empty { opacity: .55; }
        #rank-list .pos { font-weight: 800; font-size: 20px; width: 30px; text-align: center; }
        #rank-list .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 800; font-size: 16px; line-height: 1.05; display: flex; flex-direction: column; }
        #rank-list .nm small { font-weight: 600; font-size: 12px; opacity: .9; }
        #rank-list .sc { font-weight: 800; font-size: 18px; }
        #rank-credit { color: #fff; opacity: .85; font-size: 11px; font-weight: 600; text-shadow: 0 1px 0 #3d210c; }
        .rank-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

        /* ---------- Menu de pausa ---------- */
        #menu {
          position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
          background: rgba(10, 30, 50, .6);
        }
        #menu.open { display: flex; }
        .panel {
          background: linear-gradient(#c88a4f, #9a5e2d); border: 5px solid #5a3214; border-radius: 18px;
          padding: 18px 26px; display: flex; flex-direction: column; gap: 10px; min-width: 250px;
          box-shadow: 0 8px 0 #3d210c, 0 14px 30px rgba(0,0,0,.4); text-align: center;
        }
        .panel h2 { color: #fff; font-size: 30px; text-shadow: 0 3px 0 #3d210c; }
        .panel button {
          font-family: var(--font); font-weight: 800; font-size: 19px; color: #fff; cursor: pointer;
          background: linear-gradient(#8cf04a, #3bb82a); border: 3px solid #1f8a1f; border-radius: 12px;
          padding: 4px 14px; box-shadow: 0 4px 0 #146414; text-shadow: 0 2px 0 rgba(0,70,0,.5);
        }
        .panel button:active { transform: translateY(3px); box-shadow: 0 1px 0 #146414; }
        @media (max-height: 520px) {
          #menu .panel, .rank-panel { padding: 8px 14px; gap: 5px; max-height: 96vh; overflow: auto; }
          .panel h2 { font-size: 20px; }
          .panel button { font-size: 14px; padding: 1px 10px; }
          #menu .panel { display: grid; grid-template-columns: 1fr 1fr; }
          #menu .panel h2 { grid-column: 1 / -1; }
        }
        @media (max-height: 460px) { .tagline, .how { display: none; } .logo.big .title { font-size: 52px; } .logo.big .sub { font-size: 14px; } }
    </style>
</head>
<body class="intro">

<div id="start">
    <div class="start-box">
        <div class="logo big"><div class="title">KPGAME</div><div class="sub">Salve a Floresta!</div></div>
        <div class="tagline">Ajude a capivara a limpar a natureza!</div>
        <button class="play" onclick="startGame(1)">▶ JOGAR</button>
        <div class="lvls">Fases:
            <button onclick="startGame(1)">🌳 1</button><button onclick="startGame(2)">🪵 2</button><button onclick="startGame(3)">🦅 3</button><button onclick="startGame(4)">🗑️ 4</button><button onclick="startGame(5)">🎣 5</button><button onclick="showRanking('view')">🏆 Ranking</button>
        </div>
        <div class="how">← → andar &nbsp;·&nbsp; Espaço / ▲ pular &nbsp;·&nbsp; P pausar</div>
    </div>
</div>

<div id="hud">
    <div class="hud-left">
        <div class="logo">
            <div class="title">KPGAME</div>
            <div class="sub">Salve a Floresta!</div>
        </div>
    </div>
    <div class="hud-center">
        <div id="hud-lives"></div>
        <div class="pill" id="pill-trash"><span class="ico" id="trash-ico">♻️</span><span class="txt"><span class="lbl" id="trash-lbl">Lixo:</span><span class="val" id="trash-val">0 / 6</span></span></div>
        <div class="pill"><span class="ico">⭐</span><span class="txt"><span class="lbl">Pontos:</span><span class="val" id="score-val">0</span></span></div>
        <div class="pill"><span class="ico">🍊</span><span class="txt"><span class="lbl">Laranjas:</span><span class="val" id="fruit-val">0</span></span></div>
    </div>
    <div class="hud-right">
        <div class="sign"><span class="ico" id="lvl-ico">🌳</span><span><span id="lvl-num">Fase 1:</span><br><span class="nm" id="lvl-name">Rio</span></span></div>
        <div id="btn-pause" title="Pausar"><i></i><i></i></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<div class="touch-controls">
    <div class="dpad">
        <div class="t-btn" id="btn-left"><svg viewBox="0 0 24 24"><path d="M17 3 L5 12 L17 21 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
        <div class="t-btn" id="btn-right"><svg viewBox="0 0 24 24"><path d="M7 3 L19 12 L7 21 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="actions">
        <div class="t-btn" id="btn-jump"><svg viewBox="0 0 24 24"><path d="M3 17 L12 5 L21 17 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
    </div>
</div>

<div id="rank" class="hidden">
    <div class="panel rank-panel">
        <h2 id="rank-title">🏆 Ranking</h2>
        <div id="rank-score"></div>
        <div id="rank-form">
            <input id="rank-name" maxlength="20" placeholder="Seu nome" autocomplete="off" onkeydown="if(event.key==='Enter')submitScore()">
            <button onclick="submitScore()">💾 Salvar</button>
        </div>
        <div id="rank-msg"></div>
        <ol id="rank-list"></ol>
        <div id="rank-credit"></div>
        <div class="rank-btns" id="rank-btns">
            <button onclick="rankAgain()">🔄 Jogar de novo</button>
            <button onclick="rankHome()">🏠 Início</button>
        </div>
        <button id="rank-close" onclick="hideRanking()">Fechar</button>
    </div>
</div>

<div id="menu">
    <div class="panel">
        <h2>⏸ Pausado</h2>
        <button onclick="togglePause()">▶ Continuar</button>
        <button onclick="menuLevel(1)">🌳 Fase 1: Rio</button>
        <button onclick="menuLevel(2)">🪵 Fase 2: Mata</button>
        <button onclick="menuLevel(3)">🦅 Fase 3: Caça</button>
        <button onclick="menuLevel(4)">🗑️ Fase 4: Aterro</button>
        <button onclick="menuLevel(5)">🎣 Fase 5: Pesca</button>
        <button onclick="showRanking('view')">🏆 Ranking</button>
        <button onclick="goHome()">🏠 Início</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
    }
    window.addEventListener('resize', resize);
    resize();

    // ================== ÁUDIO ==================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function tone(type, f1, f2, vol, dur, delay = 0, exp = false) {
      initAudio();
      const t = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, t);
      if (f2 !== f1) (exp ? osc.frequency.exponentialRampToValueAtTime(f2, t + dur) : osc.frequency.linearRampToValueAtTime(f2, t + dur));
      gain.gain.setValueAtTime(vol, t);
      gain.gain.linearRampToValueAtTime(0.001, t + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + dur);
    }
    const SFX = {
      jump()    { tone('sine', 150, 450, 0.15, 0.15, 0, true); },
      collect() { tone('triangle', 587.33, 880, 0.12, 0.2); },
      splash()  { tone('sine', 520, 180, 0.08, 0.2); },
      coin()    { tone('square', 988, 1319, 0.06, 0.18); },
      heart()   { tone('triangle', 660, 660, 0.14, 0.12); tone('triangle', 990, 1320, 0.14, 0.22, 0.1); },
      hit()     { tone('sawtooth', 120, 40, 0.2, 0.25); },
      win()     { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('sine', f, f, 0.15, 0.2, i * 0.12)); }
    };
    let musicTimer = 0;
    function updateMusic() {
      if (!audioCtx || audioCtx.state !== 'running') return;
      musicTimer++;
      if (musicTimer % 80 === 0) {
        const base = currentLevel === 1 ? 220 : (currentLevel === 2 ? 164.81 : 196);
        tone('triangle', base * (Math.random() > 0.7 ? 1.5 : 1), base, 0.03, 0.4);
      }
    }

    // ================== ESTADO ==================
    const LEVELS = {
      1: { name: 'Rio',  ico: '🌳', width: 3350 },
      2: { name: 'Mata', ico: '🪵', width: 3090 },
      3: { name: 'Caça', ico: '🦅', width: 3070 },
      4: { name: 'Aterro', ico: '🗑️', width: 3100 },
      5: { name: 'Pesca', ico: '🎣', width: 3210 }
    };
    let currentLevel = 1, keys = { left: false, right: false };
    let cameraX = 0, globalTick = 0;
    let trashCollected = 0, fruitsCollected = 0, lives = 3;
    let gameOver = false, gameWon = false, hasBird = false, paused = false, started = false;
    let msgBanner = "", msgTimer = 0, levelTimeout = null;
    let score = 0, popups = [], freedAnimals = [];

    // Queda suave: gravidade menor e velocidade máxima de queda baixa.
    // Os pulos foram ajustados para manter a mesma altura de antes.
    const GRAVITY = 0.36, MAX_FALL = 6.5;
    const JUMP_V = -9.3, DOUBLE_JUMP_V = -8.6, STOMP_V = -10.2, SWIM_JUMP_V = -11;
    const SOLID = { grass: 1, factory: 1, forest: 1, camp: 1, dump: 1, boat: 1 };

    const capy = {
      x: 100, y: 100, vx: 0, vy: 0, w: 46, h: 58,
      dir: 1, grounded: false, jumps: 0, maxJumps: 1,
      animTick: 0, invuln: 0, air: 0, inWater: false, safeX: 80, safeY: 100
    };

    let platforms = [], items = [], particles = [], traps = [], barrels = [];
    let cagedBird = null, boss = null;
    const clouds = [];
    for (let i = 0; i < 14; i++) clouds.push({ x: i * 320 + (i * 53 % 90), y: 60 + (i * 37 % 100), s: 0.8 + (i % 3) * 0.25 });

    function rnd(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
    function addScore(n, x, y) {
      score += n;
      if (x !== undefined) popups.push({ x, y, text: '+' + n, life: 55 });
      updateHUD();
    }
    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++)
        particles.push({ x, y, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.8) * 7, life: 30, color });
    }

    // ================== HUD ==================
    function updateHUD() {
      let h = '';
      for (let i = 0; i < 3; i++) h += `<span class="heart${i < lives ? '' : ' lost'}">❤️</span>`;
      document.getElementById('hud-lives').innerHTML = h;
      const l1 = currentLevel === 1 || currentLevel === 4;
      const tot = currentLevel === 4 ? 8 : 6;
      document.getElementById('trash-ico').innerText = l1 ? '♻️' : '🐾';
      document.getElementById('trash-lbl').innerText = l1 ? 'Lixo:' : 'Animais:';
      document.getElementById('trash-val').innerText = l1 ? `${trashCollected} / ${tot}` : `${animalsFreed}`;
      if (currentLevel === 5) {
        const nt = items.filter(i => i.kind === 'net').length;
        document.getElementById('trash-ico').innerText = '🐟';
        document.getElementById('trash-lbl').innerText = 'Salvos:';
        document.getElementById('trash-val').innerText = `${animalsFreed} / ${nt}`;
      }
      document.getElementById('fruit-val').innerText = fruitsCollected;
      document.getElementById('score-val').innerText = score;
      document.getElementById('lvl-ico').innerText = LEVELS[currentLevel].ico;

    function bindTouch(id, onDown, onUp) {
      const el = document.getElementById(id);
      const down = e => { e.preventDefault(); initAudio(); onDown(); };
      const up = e => { e.preventDefault(); if (onUp) onUp(); };
      el.addEventListener('touchstart', down, { passive: false });
      el.addEventListener('touchend', up, { passive: false });
      el.addEventListener('touchcancel', up, { passive: false });
      el.addEventListener('mousedown', down);
      el.addEventListener('mouseup', up);
      el.addEventListener('mouseleave', up);

    // ================== ATUALIZAÇÃO ==================
    function update() {
      if (!started) {
        globalTick++;
        const gi = groundY() - capy.h, hop = Math.abs(Math.sin(globalTick * 0.07)) * 30;
        capy.x = Math.min(80, W * 0.08); capy.y = gi - hop; capy.dir = 1; capy.air = hop > 4 ? 10 : 0; capy.grounded = hop <= 4;
        return;
      }
      if (paused) return;
      globalTick++;
      updateMusic();
      if (msgTimer > 0 && !gameOver && !gameWon) msgTimer--;
      if (capy.invuln > 0) capy.invuln--;
      if (gameOver || gameWon) return;

      const spd = capy.inWater ? 1.6 : 2.0;
      if (keys.left) { capy.vx = -spd; capy.dir = -1; capy.animTick += 0.11; }
      else if (keys.right) { capy.vx = spd; capy.dir = 1; capy.animTick += 0.11; }
      else { capy.vx *= 0.72; capy.animTick = capy.inWater ? capy.animTick + 0.07 : 0; }

      const prevX = capy.x;
      capy.x += capy.vx;
      if (capy.x < 0) capy.x = 0;
      const maxX = LEVELS[currentLevel].width - capy.w;
      if (capy.x > maxX) capy.x = maxX;
      // margens do terreno são paredes (não dá para atravessar a barranca nadando)
      for (const p of platforms) {
        if (!SOLID[p.type]) continue;
        const bottom = p.type === 'boat' ? p.y + 100 : H;
        if (capy.y + capy.h > p.y + 24 && capy.y < bottom && capy.x + capy.w - 6 > p.x && capy.x + 6 < p.x + p.w) {
          capy.x = (prevX + capy.w / 2 < p.x + p.w / 2) ? p.x - capy.w + 6 : p.x + p.w - 6;
          capy.vx = 0;
        }
      }

      capy.vy = Math.min(capy.vy + GRAVITY, MAX_FALL);
      const prevBottom = capy.y + capy.h;
      capy.y += capy.vy;
      capy.grounded = false;

      for (const p of platforms) {
        if (p.type === 'falling' && p.triggered && p.dropTimer > 0) { p.dropTimer--; p.y += 0.4; }
      }
      for (const p of platforms) {
        if (p.type === 'falling' && p.triggered && p.dropTimer <= 0) continue;
        if (capy.x + capy.w - 6 > p.x && capy.x + 6 < p.x + p.w) {
          if (capy.vy >= 0 && prevBottom <= p.y + 14 && capy.y + capy.h >= p.y - 3) {
            capy.y = p.y - capy.h; capy.vy = 0; capy.grounded = true; capy.jumps = 0;
            capy.safeX = Math.max(p.x + 12, Math.min(capy.x, p.x + p.w - capy.w - 12));
            capy.safeY = p.y - capy.h;
            if (p.type === 'falling' && !p.triggered) { p.triggered = true; p.dropTimer = 220; }
          }
        }
      }

      capy.air = capy.grounded ? 0 : capy.air + 1;
      for (const t of traps) {
        if (Math.abs((capy.x + 23) - t.x) < 24 && Math.abs((capy.y + 29) - t.y) < 24) loseLife();
      }

      // A capivara nada: na água ela flutua, não perde vida e pode pular para sair
      const waterLevel = H - 40, wasInWater = capy.inWater;
      capy.inWater = !capy.grounded && capy.y + capy.h >= waterLevel;
      if (capy.inWater) {
        if (!wasInWater) { SFX.splash(); spawnParticles(capy.x + capy.w / 2, H - 44, "#d6f1ff", 16); }
        capy.jumps = 0;
        if (capy.waterGrace > 0) capy.waterGrace--;
        else { capy.vy += ((H - 44) - (capy.y + capy.h)) * 0.02; capy.vy *= 0.85; }
        if (globalTick % 14 === 0) spawnParticles(capy.x + capy.w / 2, H - 44, "#d6f1ff", 2);
      }

      for (const it of items) {
        if (!it.collected && Math.abs((capy.x + 23) - it.x) < 34 && Math.abs((capy.y + 29) - it.y) < 38) {
          it.collected = true;
          if (it.kind === 'heart') {
            SFX.heart(); spawnParticles(it.x, it.y, "#ff4d6d", 14);
            if (lives < 3) { lives++; popups.push({ x: it.x, y: it.y - 10, text: '+❤', life: 60 }); updateHUD(); }
            else addScore(150, it.x, it.y - 10);
            continue;
          }
          if (it.kind === 'coin') { SFX.coin(); spawnParticles(it.x, it.y, "#ffd23f", 8); addScore(10, it.x, it.y); continue; }
          if (it.kind === 'net') {
            SFX.collect(); animalsFreed++;
            spawnParticles(it.x, it.y, "#e6d6a0", 18); spawnParticles(it.x, it.y, "#bde9ff", 8);
            addScore(150, it.x, it.y - 30);
            freedAnimals.push({ kind: it.animal, col: it.col, x: it.x, y: it.y, vx: 1.6 + Math.random() * 1.2, vy: -7.5 - Math.random() * 2, t: 0 });
            updateHUD(); continue;
          }
          SFX.collect();
          if (it.kind === 'tangerine') { fruitsCollected++; spawnParticles(it.x, it.y, "#ff9f1c", 10); addScore(50, it.x, it.y); }
          else if (it.kind === 'cage') {
            fruitsCollected += 2; animalsFreed++; addScore(200, it.x, it.y - 20);
            spawnParticles(it.x, it.y, "#00b4d8", 15);
            msgBanner = "🐾 Animal libertado da gaiola com sucesso!"; msgTimer = 160;
          } else {
            trashCollected++; spawnParticles(it.x, it.y, "#80ed99", 10); addScore(100, it.x, it.y);
            if (it.first) { msgBanner = "♻️ Garrafa recolhida! Continue limpando o caminho!"; msgTimer = 190; }
          }
          updateHUD();
        }
      }

      if (cagedBird && !cagedBird.freed) {
        if (Math.abs((capy.x + 23) - cagedBird.x) < 44 && Math.abs((capy.y + 29) - cagedBird.y) < 48) {
          cagedBird.freed = true; hasBird = true; capy.maxJumps = 2; animalsFreed++; addScore(200, cagedBird.x, cagedBird.y - 30);
          SFX.win(); spawnParticles(cagedBird.x, cagedBird.y, "#00b4d8", 14);
          updateHUD();
          msgBanner = "🦝 Guaxinim salvo! PULO DUPLO ativado!"; msgTimer = 240;
        }
      }

      if (boss && !boss.defeated) {
        if (boss.vx !== 0) {
          boss.x += boss.vx * boss.moveDir;
          if (boss.x > boss.startX + 120 || boss.x < boss.startX - 40) boss.moveDir *= -1;
        }
        if (boss.hitCooldown > 0) boss.hitCooldown--;
        boss.timer++;
        if (boss.timer % 150 === 0) {
          const sp = currentLevel === 3 ? -2.4 : (currentLevel === 4 ? -2.1 : (currentLevel === 5 ? -2.5 : -1.8));
          barrels.push({ x: boss.x - 15, y: boss.y + boss.h - 60, vx: sp, rot: 0 });
        }
        const headX = boss.x + 25, headY = boss.y - 10, headW = 90, headH = 30;
        if (capy.vy > 0 && capy.x + capy.w > headX && capy.x < headX + headW &&
            capy.y + capy.h >= headY && capy.y + capy.h <= headY + headH + 18 && boss.hitCooldown === 0) {
          boss.hp--; boss.hitCooldown = 45; capy.vy = STOMP_V; addScore(150, capy.x, capy.y - 10);
          SFX.hit(); spawnParticles(headX + 45, headY, "#e63946", 14);
          if (boss.hp <= 0) {
            boss.defeated = true; barrels = []; SFX.win(); addScore(500, boss.x + 60, boss.y - 20);
            spawnParticles(boss.x + 85, boss.y + 60, "#52b788", 25);
            if (currentLevel < 5) {
              msgBanner = `🎉 Vitória na Fase ${currentLevel}! Avançando...`; msgTimer = 220;
              const next = currentLevel + 1;
              levelTimeout = setTimeout(() => loadLevel(next), 2200);
            } else { gameWon = true; score += lives * 200; updateHUD(); endGame(true); }
          } else { msgBanner = `💥 Atingido! Faltam ${boss.hp} golpes!`; msgTimer = 140; }
        }
      }

      for (let i = barrels.length - 1; i >= 0; i--) {
        const b = barrels[i];
        b.x += b.vx; b.rot -= 0.08;
        if (!(boss && boss.defeated) && Math.abs((capy.x + 23) - b.x) < (currentLevel === 5 ? 40 : 28) && Math.abs((capy.y + 29) - b.y) < 28) loseLife();
        if (b.x < -50) barrels.splice(i, 1);
      }
      for (let i = freedAnimals.length - 1; i >= 0; i--) {
        const a = freedAnimals[i]; a.t++;
        if (a.kind === 'duck') { a.x += 2.4; a.y -= 1.6 + Math.sin(a.t * 0.2) * 0.5; }
        else {
          a.x += a.vx; a.vy += 0.3; a.y += a.vy;
          if (a.y > H - 46) { spawnParticles(a.x, H - 46, "#d6f1ff", 12); freedAnimals.splice(i, 1); continue; }
        }
        if (a.t > 200) freedAnimals.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) { const pu = popups[i]; pu.y -= 0.8; pu.life--; if (pu.life <= 0) popups.splice(i, 1); }
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      const maxScroll = Math.max(0, LEVELS[currentLevel].width - W);
      const targetCam = capy.x - W * 0.32;
      cameraX += (Math.max(0, Math.min(maxScroll, targetCam)) - cameraX) * 0.1;
    }

    // ================== DESENHO: utilidades ==================
    function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

    function drawPaw(x, y, s, color) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.ellipse(x, y + 3 * s, 5 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();
      [[-5.5, -3], [-2, -6.5], [2, -6.5], [5.5, -3]].forEach(([dx, dy]) => {
        ctx.beginPath(); ctx.ellipse(x + dx * s, y + dy * s, 2 * s, 2.4 * s, 0, 0, Math.PI * 2); ctx.fill();
      });
    }

    function drawRaccoon(x, y, s) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.lineWidth = 2; ctx.strokeStyle = "#2b2d42";
      // rabo listrado
      ctx.fillStyle = "#8d99ae";
      ctx.beginPath(); ctx.roundRect(12, 4, 22, 11, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#2b2d42"; ctx.fillRect(18, 4, 4, 11); ctx.fillRect(26, 4, 4, 11);
      // corpo
      ctx.fillStyle = "#adb5bd";
      ctx.beginPath(); ctx.ellipse(0, 8, 15, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // orelhas
      ctx.beginPath(); ctx.moveTo(-14, -12); ctx.lineTo(-9, -24); ctx.lineTo(-3, -14); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14, -12); ctx.lineTo(9, -24); ctx.lineTo(3, -14); ctx.fill(); ctx.stroke();
      // cabeça
      ctx.beginPath(); ctx.ellipse(0, -6, 16, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f8f9fa"; ctx.beginPath(); ctx.ellipse(0, -2, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2b2d42"; ctx.beginPath(); ctx.roundRect(-14, -11, 28, 8, 4); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-6, -7, 2.4, 0, 6.3); ctx.arc(6, -7, 2.4, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(-6, -7, 1.2, 0, 6.3); ctx.arc(6, -7, 1.2, 0, 6.3); ctx.arc(0, -1, 2.2, 0, 6.3); ctx.fill();
      ctx.restore();
    }

    function drawBirdSmall(x, y, s) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.fillStyle = "#00b4d8"; ctx.strokeStyle = "#0077b6"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ffb703"; ctx.beginPath(); ctx.moveTo(9, -1); ctx.lineTo(17, 2); ctx.lineTo(9, 5); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(3, -4, 3, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(4, -4, 1.4, 0, 6.3); ctx.fill();
      ctx.restore();
    }

    function drawCage(x, y, w, h, animal) {
      // x,y = centro da base
      const l = x - w / 2, t = y - h;
      if (animal === 'raccoon') drawRaccoon(x, y - 22, 0.85);
      else if (animal === 'bird') drawBirdSmall(x, y - 20, 1.1);
      ctx.strokeStyle = "#3a4250"; ctx.lineWidth = 3;
      for (let i = 0; i <= 5; i++) { const bx = l + 4 + i * ((w - 8) / 5); ctx.beginPath(); ctx.moveTo(bx, t + 4); ctx.lineTo(bx, y - 4); ctx.stroke(); }
      ctx.fillStyle = "#8d99ae"; ctx.strokeStyle = "#3a4250"; ctx.lineWidth = 2.5;
      rr(l - 2, t - 2, w + 4, 8, 3); ctx.fill(); ctx.stroke();
      rr(l - 2, y - 7, w + 4, 8, 3); ctx.fill(); ctx.stroke();
    }

    function drawBush(x, y, s, shade) {
      const cols = [["#33b24f", "#62d36e"], ["#3fc05a", "#74dc82"], ["#2aa86a", "#58cf95"]][((Math.floor(shade) % 3) + 3) % 3];
      const lobes = [[-15, -9, 12], [0, -16, 16], [15, -9, 12]];
      ctx.lineJoin = "round";
      // contorno grosso
      ctx.strokeStyle = "#17602e"; ctx.lineWidth = 7;
      ctx.beginPath(); lobes.forEach(([dx, dy, r]) => { ctx.moveTo(x + dx * s + r * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 6.3); }); ctx.stroke();
      ctx.fillStyle = cols[0];
      ctx.beginPath(); lobes.forEach(([dx, dy, r]) => { ctx.moveTo(x + dx * s + r * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 6.3); }); ctx.fill();
      ctx.fillStyle = cols[1];
      ctx.beginPath(); ctx.arc(x - 4 * s, y - 20 * s, 7 * s, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.arc(x - 17 * s, y - 12 * s, 3.5 * s, 0, 6.3); ctx.fill();
    }
    function drawFlower(x, y, c) {
      const pet = ["#ff6f91", "#ffd166", "#f78fb3"][c % 3];
      ctx.strokeStyle = "#1c8a3a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 18); ctx.stroke();
      ctx.fillStyle = "#34c759"; ctx.beginPath(); ctx.ellipse(x + 5, y - 7, 6, 3, -0.5, 0, 6.3); ctx.fill();
      ctx.fillStyle = pet;
      for (let a = 0; a < 5; a++) { ctx.beginPath(); ctx.arc(x + Math.cos(a * 1.2566) * 6, y - 22 + Math.sin(a * 1.2566) * 6, 5.2, 0, 6.3); ctx.fill(); ctx.strokeStyle = 'rgba(120,20,50,.5)'; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.fillStyle = "#ffe066"; ctx.beginPath(); ctx.arc(x, y - 20, 3, 0, 6.3); ctx.fill();
    }

    function drawWoodSign(x, y) {
      // placa "Mantenha a floresta limpa!"
      ctx.fillStyle = "#8a5a2b"; ctx.strokeStyle = "#4a2d12"; ctx.lineWidth = 3;
      ctx.fillRect(x + 14, y - 30, 8, 30); ctx.strokeRect(x + 14, y - 30, 8, 30);
      ctx.fillRect(x + 94, y - 30, 8, 30); ctx.strokeRect(x + 94, y - 30, 8, 30);
      const g = ctx.createLinearGradient(0, y - 90, 0, y - 28);
      g.addColorStop(0, "#d9a066"); g.addColorStop(1, "#b97a43");
      ctx.fillStyle = g; rr(x, y - 90, 116, 62, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "800 14px 'Baloo 2','Trebuchet MS',sans-serif"; ctx.textAlign = "center";
      ctx.shadowColor = "#4a2d12"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 2;
      ctx.fillText("Mantenha", x + 56, y - 66); ctx.fillText("a floresta", x + 56, y - 50); ctx.fillText("limpa!", x + 56, y - 34);
      ctx.shadowOffsetY = 0; ctx.textAlign = "left";
      ctx.fillStyle = "#34c759"; ctx.beginPath(); ctx.ellipse(x + 100, y - 70, 8, 4, -0.7, 0, 6.3); ctx.fill();
      // caixa com folha
      ctx.fillStyle = "#c98f55"; ctx.strokeStyle = "#4a2d12"; ctx.lineWidth = 3;
      rr(x + 130, y - 58, 52, 50, 4); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#8a5a2b"; ctx.beginPath(); ctx.moveTo(x + 130, y - 42); ctx.lineTo(x + 182, y - 42); ctx.moveTo(x + 130, y - 24); ctx.lineTo(x + 182, y - 24); ctx.stroke();
      ctx.fillStyle = "#34c759"; ctx.beginPath(); ctx.ellipse(x + 156, y - 34, 12, 6, -0.7, 0, 6.3); ctx.fill();
    }

    // ================== DESENHO: itens ==================
    function drawItem(it) {
      const bob = Math.sin(globalTick * 0.08 + it.x) * 4;
      const x = it.x, y = it.y + bob;
      ctx.save(); ctx.lineWidth = 3; ctx.lineJoin = "round";

      if (it.kind === 'tangerine') {
        ctx.fillStyle = "#ff9f1c"; ctx.strokeStyle = "#b85c00";
        ctx.beginPath(); ctx.ellipse(x, y, 13, 12, 0, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.beginPath(); ctx.ellipse(x - 4, y - 4, 4, 3, -0.5, 0, 6.3); ctx.fill();
        ctx.fillStyle = "#2ec4b6"; ctx.strokeStyle = "#1a7a70";
        ctx.beginPath(); ctx.ellipse(x + 4, y - 13, 7, 3.5, -0.4, 0, 6.3); ctx.fill(); ctx.stroke();
      } else if (it.kind === 'coin') {
        const sq = Math.abs(Math.cos(globalTick * 0.05 + it.x));
        ctx.translate(x, y); ctx.scale(0.35 + 0.65 * sq, 1);
        ctx.fillStyle = "#ffc933"; ctx.strokeStyle = "#c27c00"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 16, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#ffe58a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, 6.3); ctx.stroke();
        drawPaw(0, 0, 1.1, "#d98a00");
      } else if (it.kind === 'cage') {
        drawCage(x, y + 18, 38, 40, it.animal);
      } else if (it.kind === 'net') {
        drawNetItem(it);
      } else if (it.kind === 'heart') {
        const pul = 1 + Math.sin(globalTick * 0.12) * 0.09;
        ctx.translate(x, y); ctx.scale(pul, pul);
        ctx.fillStyle = "rgba(255,120,140,.28)"; ctx.beginPath(); ctx.arc(0, 0, 26, 0, 6.3); ctx.fill();
        const hg = ctx.createLinearGradient(0, -16, 0, 14); hg.addColorStop(0, "#ff6b81"); hg.addColorStop(1, "#d90429");
        ctx.fillStyle = hg; ctx.strokeStyle = "#7a0c1e"; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(0, 14); ctx.bezierCurveTo(-26, -2, -17, -22, 0, -9); ctx.bezierCurveTo(17, -22, 26, -2, 0, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.65)"; ctx.beginPath(); ctx.ellipse(-9, -9, 4.5, 2.8, -0.6, 0, 6.3); ctx.fill();
        ctx.fillStyle = "#fff"; const sp = (globalTick * 0.1) % 6.28;
        ctx.beginPath(); ctx.arc(Math.cos(sp) * 22, Math.sin(sp) * 20, 2, 0, 6.3); ctx.fill();
      } else if (it.kind === 'bag') {
        ctx.fillStyle = "#3b6fb5"; ctx.strokeStyle = "#16294a"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(x, y + 3, 14, 13, 0, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - 6, y - 8); ctx.lineTo(x - 3, y - 18); ctx.lineTo(x + 1, y - 10); ctx.lineTo(x + 5, y - 18); ctx.lineTo(x + 6, y - 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.beginPath(); ctx.ellipse(x - 5, y, 3.5, 6, 0.4, 0, 6.3); ctx.fill();
      } else if (it.kind === 'bottle') {
        ctx.translate(x, y); ctx.rotate(0.25);
        ctx.fillStyle = "rgba(144,224,239,.95)"; ctx.strokeStyle = "#0077b6";
        ctx.beginPath(); ctx.roundRect(-9, -14, 18, 28, 5); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#e63946"; ctx.fillRect(-9, -4, 18, 9); ctx.fillRect(-5, -20, 10, 6);
      } else if (it.kind === 'can') {
        ctx.fillStyle = "#ced4da"; ctx.strokeStyle = "#343a40";
        ctx.beginPath(); ctx.roundRect(x - 9, y - 12, 18, 24, 4); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#f77f00"; ctx.fillRect(x - 8, y - 4, 16, 8);
      } else if (it.kind === 'tire') {
        ctx.fillStyle = "#2b2f36"; ctx.strokeStyle = "#0f1114"; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.arc(x, y, 17, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#7c8794"; ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(x - 6, y - 6, 4, 0, 6.3); ctx.fill();
      }
      ctx.restore();
    }

    // ================== DESENHO: capivara ==================
    function drawCapybara(x, y) {
      if (capy.invuln > 0 && Math.floor(capy.invuln / 4) % 2 === 0) return;
      ctx.save();
      ctx.translate(x + capy.w / 2, y + capy.h / 2);
      ctx.scale(capy.dir * 1.2, 1.2);
      ctx.translate(0, -5);
      const jumping = capy.air > 6 && !capy.inWater;
      const legSwing = Math.sin(capy.animTick) * 7;
      const OUT = "#3b2212";
      ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.lineWidth = 3.5; ctx.strokeStyle = OUT;

      // perna de trás + perna da frente
      ctx.fillStyle = "#a8662f";
      ctx.beginPath(); ctx.roundRect(-16 + legSwing, 14, 13, 17, 6); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(5 - legSwing, 14, 13, 17, 6); ctx.fill(); ctx.stroke();

      // mochila verde com símbolo de reciclagem
      ctx.fillStyle = "#35c46a"; ctx.strokeStyle = "#13683a";
      ctx.beginPath(); ctx.roundRect(-33, -8, 19, 27, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#6be08e"; ctx.beginPath(); ctx.roundRect(-30, -5, 6, 13, 3); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("♻", -23.5, 12); ctx.textAlign = "left";
      ctx.strokeStyle = OUT;

      // corpo gordinho
      const bg = ctx.createLinearGradient(0, -18, 0, 28);
      bg.addColorStop(0, "#e0a45c"); bg.addColorStop(1, "#bb7640");
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, 5, 22, 22, 0, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f1d3a0"; ctx.beginPath(); ctx.ellipse(7, 9, 11, 13, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.beginPath(); ctx.ellipse(-8, -6, 6, 9, -0.5, 0, 6.3); ctx.fill();

      // orelhas
      ctx.fillStyle = "#a8662f";
      ctx.beginPath(); ctx.ellipse(-5, -32, 5, 6, -0.3, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(5, -33, 5, 6.5, 0.2, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#e8a08a"; ctx.beginPath(); ctx.ellipse(5, -33, 2.4, 3.4, 0.2, 0, 6.3); ctx.fill();

      // cabeça grande
      const hg = ctx.createLinearGradient(0, -32, 0, -4);
      hg.addColorStop(0, "#e5ab63"); hg.addColorStop(1, "#c9884a");
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.roundRect(-14, -32, 40, 29, 14); ctx.fill(); ctx.stroke();
      // focinho
      ctx.fillStyle = "#a8662f";
      ctx.beginPath(); ctx.roundRect(13, -26, 17, 21, 9); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#3b2212"; ctx.beginPath(); ctx.ellipse(26.5, -20, 2.6, 3.2, 0, 0, 6.3); ctx.fill();
      // boca determinada
      ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(18, -10); ctx.quadraticCurveTo(23, -7, 28, -10); ctx.stroke(); ctx.lineWidth = 3.5;
      // olho grande
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(6, -19, 5.6, 6.4, 0, 0, 6.3); ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = "#1a1008"; ctx.beginPath(); ctx.ellipse(7.6, -18.5, 3.4, 4.4, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(9, -20.5, 1.5, 0, 6.3); ctx.arc(6.5, -16.5, 0.8, 0, 6.3); ctx.fill();
      // sobrancelha brava
      ctx.strokeStyle = OUT; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(12, -23.5); ctx.stroke(); ctx.lineWidth = 3.5;
      // bochecha
      ctx.fillStyle = "rgba(255,120,110,.45)"; ctx.beginPath(); ctx.ellipse(-4, -9, 5, 3.2, 0, 0, 6.3); ctx.fill();

      // braço
      ctx.fillStyle = "#a8662f";
      ctx.beginPath();
      if (jumping) ctx.roundRect(-8, -12, 11, 20, 5); else ctx.roundRect(-3, -1, 18, 10, 5);
      ctx.fill(); ctx.stroke();

      // laranja na cabeça
      ctx.fillStyle = "#ff9f1c"; ctx.strokeStyle = "#a84f00"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(1, -39, 8, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(-2, -42, 3, 2, -0.5, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#35c46a"; ctx.strokeStyle = "#13683a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(5, -48, 5, 2.6, -0.5, 0, 6.3); ctx.fill(); ctx.stroke();

      if (hasBird) drawBirdSmall(-8, -44, 0.55);
      ctx.restore();
    }

    // ================== DESENHO: cenário ==================
    function drawBackground() {
      const skies = {
        1: ["#3cb9e8", "#bdeefa"],
        2: ["#4cc3d9", "#d7f3c9"],
        3: ["#ff9e6d", "#ffe0a8"],

        ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(30, 16); ctx.lineTo(41, 21); ctx.moveTo(60, 16); ctx.lineTo(49, 21); ctx.stroke(); ctx.lineWidth = 3;
        // chapéu de chuva
        ctx.fillStyle = "#ffc21a";

        // arpão (recua antes de arremessar)

        ctx.fillStyle = "#ffc21a"; rr(wind * 0.5, 44, 26, 13, 6); ctx.fill(); ctx.stroke();

        ctx.beginPath(); ctx.moveTo(-88, 49.5); ctx.lineTo(-68, 38); ctx.lineTo(-70, 47); ctx.lineTo(-62, 47); ctx.lineTo(-62, 52); ctx.lineTo(-70, 52); ctx.lineTo(-68, 61); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#e8d29b"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(62, 50); ctx.quadraticCurveTo(78, 72, 54, 80); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = "#e0a96d"; ctx.beginPath(); ctx.arc(8 + wind * 0.5, 50, 7, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.restore();
      } else {

        rr(24 + walk, 80, 14, 42, 4); ctx.fill(); ctx.stroke(); rr(52 - walk, 80, 14, 42, 4); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#3d2b1f"; rr(21 + walk, 116, 20, 11, 4); ctx.fill(); ctx.stroke(); rr(49 - walk, 116, 20, 11, 4); ctx.fill(); ctx.stroke();
        // tronco
        ctx.fillStyle = lumber ? "#c0392b" : "#386641"; rr(18, 34, 54, 52, 10); ctx.fill(); ctx.stroke();
        if (lumber) { ctx.strokeStyle = "#7a1d14"; ctx.lineWidth = 2; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(26 + i * 13, 36); ctx.lineTo(26 + i * 13, 84); ctx.stroke(); } for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.moveTo(20, 46 + j * 11); ctx.lineTo(70, 46 + j * 11); ctx.stroke(); } ctx.strokeStyle = "#111"; ctx.lineWidth = 3; }
        // cabeça
        ctx.fillStyle = "#e0a96d"; ctx.beginPath(); ctx.arc(45, 20, 19, 0, 6.3); ctx.fill(); ctx.stroke();
        if (lumber) {
          ctx.fillStyle = "#432818"; ctx.beginPath(); ctx.roundRect(28, 24, 32, 18, [2, 2, 12, 12]); ctx.fill();
          ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.roundRect(26, 0, 38, 11, [10, 10, 2, 2]); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(37, 17, 2.6, 0, 6.3); ctx.arc(51, 17, 2.6, 0, 6.3); ctx.fill();
          ctx.strokeStyle = "#111"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(31, 11); ctx.lineTo(41, 15); ctx.moveTo(57, 11); ctx.lineTo(48, 15); ctx.stroke();
        } else {
          ctx.fillStyle = "#6a994e"; ctx.beginPath(); ctx.roundRect(26, 0, 38, 12, [8, 8, 2, 2]); ctx.fill(); ctx.stroke(); ctx.fillRect(18, 8, 18, 5);

          ctx.strokeStyle = "#111"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(31, 12); ctx.lineTo(41, 16); ctx.moveTo(57, 12); ctx.lineTo(48, 16); ctx.moveTo(36, 31); ctx.lineTo(54, 31); ctx.stroke();
        }
        ctx.lineWidth = 3; ctx.strokeStyle = "#111";
        // braço e arma
        ctx.fillStyle = lumber ? "#c0392b" : "#386641"; rr(0, 42, 26, 13, 6); ctx.fill(); ctx.stroke();
        if (lumber) {
          ctx.fillStyle = "#e63946"; rr(-14, 34, 24, 28, 6); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#cfd4da"; rr(-58, 40, 52, 14, 5); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#333";
          const off = (globalTick * 2) % 8;
          for (let k = -56 + off; k < -8; k += 8) ctx.fillRect(k, 52, 4, 5);
          for (let k = -56 + off; k < -8; k += 8) ctx.fillRect(k, 37, 4, 4);
        } else {

    }

    function drawBarrel(b) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(currentLevel === 5 ? 0 : b.rot);
      ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#1b2a41";
      if (currentLevel === 1) {
        // barril tóxico azul com faixa vermelha
        ctx.fillStyle = "#3a8fd6"; rr(-20, -13, 40, 26, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#d62828"; ctx.fillRect(-8, -13, 16, 26); ctx.strokeRect(-8, -13, 16, 26);
        ctx.fillStyle = "rgba(255,255,255,.5)"; rr(-17, -9, 6, 6, 3); ctx.fill();
      } else if (currentLevel === 2) {
        ctx.fillStyle = "#cfd4da"; ctx.strokeStyle = "#212529";
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#d90429";
        for (let a = 0; a < 6.28; a += Math.PI / 4) { ctx.beginPath(); ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14); ctx.lineTo(Math.cos(a + 0.2) * 21, Math.sin(a + 0.2) * 21); ctx.lineTo(Math.cos(a + 0.4) * 14, Math.sin(a + 0.4) * 14); ctx.fill(); }
        ctx.fillStyle = "#6c757d"; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.3); ctx.fill();
      } else if (currentLevel === 5) {
        // arpão voando
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#e8d29b"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(36, 0); ctx.quadraticCurveTo(52, 14 + Math.sin(globalTick * 0.3) * 4, 74, 4); ctx.stroke();
        ctx.fillStyle = "#8a5a2b"; ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(-32, -3.5, 70, 7, 3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#e63946"; ctx.beginPath(); ctx.moveTo(26, -3); ctx.lineTo(40, -9); ctx.lineTo(40, 9); ctx.lineTo(26, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#dfe6ec"; ctx.strokeStyle = "#2b3440";
        ctx.beginPath(); ctx.moveTo(-58, 0); ctx.lineTo(-40, -10); ctx.lineTo(-42, -3); ctx.lineTo(-32, -3); ctx.lineTo(-32, 3); ctx.lineTo(-42, 3); ctx.lineTo(-40, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (currentLevel === 4) {
        ctx.fillStyle = "#2b2f3a"; ctx.strokeStyle = "#0b0d12"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(0, 3, 17, 15, 0, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(-3, -19); ctx.lineTo(1, -11); ctx.lineTo(5, -19); ctx.lineTo(7, -9); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.ellipse(-6, 0, 4, 7, 0.4, 0, 6.3); ctx.fill();
      } else {
        ctx.fillStyle = "#ffb703"; ctx.strokeStyle = "#111"; ctx.lineWidth = 2.5;
        ctx.strokeRect(-11, -11, 22, 22); ctx.fillRect(-11, -11, 22, 22);
        ctx.fillStyle = "#212529"; ctx.fillRect(-7, -7, 14, 14);

      ctx.restore();

    function drawTrap(t) {
      ctx.fillStyle = "#dfe4ea"; ctx.strokeStyle = "#495057"; ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath(); ctx.moveTo(t.x - 8 + k * 9, t.y + 16); ctx.lineTo(t.x - 3.5 + k * 9, t.y - 12); ctx.lineTo(t.x + 1 + k * 9, t.y + 16); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = "#6c757d"; ctx.fillRect(t.x - 10, t.y + 14, 30, 5);
    }

    // ================== DESENHO: cena ==================
    function draw() {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.textAlign = "left";
      drawBackground();

      ctx.save();
      ctx.translate(-Math.round(cameraX), 0);

      // cenário traseiro dos chefes
      for (const p of platforms) {
        if (p.type === 'factory') drawFactory(p);
        if (p.type === 'forest') drawForestBack(p);
        if (p.type === 'camp') drawCampBack(p);
        if (p.type === 'dump') drawDumpBack(p);
      }
      for (const p of platforms) {
        if (p.type === 'falling' && p.triggered && p.dropTimer <= 0) continue;
        if (p.type === 'boat') drawBoat(p); else drawGrassBlock(p);
        if (p.sign) drawWoodSign(p.x + 20, p.y);
        for (const d of p.deco) {
          if (p.sign && d.x < p.x + 220) continue;
          if (currentLevel === 4) drawJunk(d.x, p.y + 6, d.c, d.kind);
          else if (d.kind === 'flower') drawFlower(d.x, p.y + 6, d.c); else drawBush(d.x, p.y + 6, 0.9, d.c);
        }
      }
      for (const p of platforms) if (p.type === 'factory') drawFactoryPipe(p);

      traps.forEach(drawTrap);
      for (const it of items) { if (!it.collected) drawItem(it); else if (it.kind === 'net') drawNetRemains(it); }

      if (cagedBird && !cagedBird.freed) {
        const cx = cagedBird.x, cy = cagedBird.y + 40;
        drawCage(cx, cy, 70, 74, 'raccoon');
        // balão
        ctx.fillStyle = "#fff"; ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
        rr(cx - 36, cy - 120, 78, 28, 12); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - 10, cy - 92); ctx.lineTo(cx - 14, cy - 80); ctx.lineTo(cx + 6, cy - 92); ctx.fill();
        ctx.fillStyle = "#222"; ctx.font = "800 14px 'Baloo 2','Trebuchet MS',sans-serif"; ctx.textAlign = "center";
        ctx.fillText("Me ajude!", cx + 3, cy - 101); ctx.textAlign = "left";
      }

      for (const a of freedAnimals) {
        if (a.kind === 'fish') { ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(Math.atan2(a.vy, a.vx)); drawFish(0, 0, 1.2, a.col, 1); ctx.restore(); }
        else if (a.kind === 'turtle') { ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.t * 0.08); drawTurtle(0, 0, 0.9); ctx.restore(); }
        else drawDuck(a.x, a.y, 1.1, Math.sin(a.t * 0.45));
      }
      if (boss) drawBoss();
      barrels.forEach(drawBarrel);

      for (const pt of particles) {
        ctx.globalAlpha = Math.max(0, pt.life / 30);
        ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, 6.3); ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawCapybara(capy.x, capy.y);
      for (const pu of popups) {
        ctx.globalAlpha = Math.min(1, pu.life / 18);
        ctx.font = "800 22px 'Baloo 2','Trebuchet MS',sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 5; ctx.lineJoin = "round";
        ctx.strokeStyle = "#5a2d00"; ctx.strokeText(pu.text, pu.x, pu.y); ctx.fillStyle = "#ffe066"; ctx.fillText(pu.text, pu.x, pu.y);
      }
      ctx.globalAlpha = 1; ctx.textAlign = "left";
      ctx.restore();

      drawWater();
      if (currentLevel === 5) drawWaterLife();

      if (gameOver || gameWon) { ctx.fillStyle = gameWon ? "rgba(10,30,50,.55)" : "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, W, H); }
    }

    // ---------- Aterro ----------
    function mound(mx, w, h, base, fill, stroke, seed, bits) {
      ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 4; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(mx - w / 2, base + 40);
      ctx.bezierCurveTo(mx - w * 0.38, base - h * 1.05, mx + w * 0.12, base - h * 1.3, mx + w / 2, base + 40);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      const cols = ["#e63946", "#4cc9f0", "#ffd166", "#80ed99", "#f78fb3", "#d0d6dc", "#ff9f1c", "#3b6fb5"];
      for (let k = 0; k < bits; k++) {
        const u = rnd(seed + k * 1.7), px = mx - w * 0.42 + u * w * 0.84;
        const edge = 1 - Math.abs((px - mx) / (w / 2)) * 0.95;
        const py = base + 32 - rnd(seed + k * 3.1) * h * 1.0 * edge;
        ctx.save(); ctx.translate(px, py); ctx.rotate(rnd(seed + k) * 3);
        ctx.fillStyle = cols[Math.floor(rnd(seed + k * 5) * cols.length)];
        const sz = 5 + rnd(seed + k * 9) * 8;
        ctx.beginPath(); ctx.roundRect(-sz, -sz * 0.6, sz * 2, sz * 1.2, 3); ctx.fill();
        ctx.restore();
      }
    }
    function drawLandfillBack(base) {
      // montes distantes
      {
        const f = 0.15, sp = 560, off = cameraX * f, start = Math.floor(off / sp) - 1;
        for (let i = start; i < start + W / sp + 3; i++) mound(i * sp - off + 260, 520, 150 + rnd(i + 2) * 70, base, "#a2937a", "#6b5f4f", i * 13 + 1, 36);
      }
      // fumaça distante
      for (let k = 0; k < 4; k++) {
        const t = (globalTick * 0.35 + k * 90) % 360;
        ctx.fillStyle = `rgba(90,85,80,${0.45 * (1 - t / 360)})`;
        ctx.beginPath(); ctx.arc(W * 0.7 + t * 0.2, base - 160 - t * 0.7, 26 + t * 0.12, 0, 6.3); ctx.fill();
      }
      // gaivotas
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.lineCap = "round";
      for (let i = 0; i < 4; i++) {
        const gx = ((globalTick * (0.7 + i * 0.15) + i * 380) % (W + 240)) - 120, gy = 90 + i * 34 + Math.sin(globalTick * 0.05 + i) * 10, fl = Math.sin(globalTick * 0.18 + i) * 6;
        ctx.beginPath(); ctx.moveTo(gx - 16, gy + fl); ctx.quadraticCurveTo(gx - 8, gy - 8, gx, gy); ctx.quadraticCurveTo(gx + 8, gy - 8, gx + 16, gy + fl); ctx.stroke();
      }
      // montes do meio
      {
        const f = 0.35, sp = 400, off = cameraX * f, start = Math.floor(off / sp) - 1;
        for (let i = start; i < start + W / sp + 3; i++) mound(i * sp - off + 200 + rnd(i) * 60, 380, 110 + rnd(i + 8) * 60, base + 18, "#85775f", "#4d4336", i * 7 + 5, 40);
      }
      // pneus e caixas ao fundo
      {
        const f = 0.65, sp = 250, off = cameraX * f, start = Math.floor(off / sp) - 1;
        for (let i = start; i < start + W / sp + 3; i++) drawJunk(i * sp - off + rnd(i + 3) * 120, base + 26, i, i % 2 ? 'flower' : 'box');
      }
      const fg = ctx.createLinearGradient(0, base - 60, 0, base + 40);
      fg.addColorStop(0, "rgba(239,227,191,0)"); fg.addColorStop(1, "rgba(200,185,140,.5)");
      ctx.fillStyle = fg; ctx.fillRect(0, base - 60, W, 100);
    }
    function drawJunk(x, y, c, kind) {
      ctx.lineJoin = "round"; ctx.lineWidth = 3;
      if (kind === 'flower') {
        const bc = ["#2b2f3a", "#2f7d4f", "#3b6fb5"];
        [[-10, 0, 13], [9, 2, 11]].forEach(([dx, dy, r], i) => {
          const col = bc[(c + i + 3) % 3];
          ctx.fillStyle = col; ctx.strokeStyle = "#0b0d12";
          ctx.beginPath(); ctx.ellipse(x + dx, y + dy - r * 0.8, r, r * 0.9, 0, 0, 6.3); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x + dx - 4, y + dy - r * 1.6); ctx.lineTo(x + dx - 1, y + dy - r * 2.2); ctx.lineTo(x + dx + 4, y + dy - r * 1.6); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.ellipse(x + dx - r * 0.4, y + dy - r, 2.5, 5, 0.4, 0, 6.3); ctx.fill();
        });
      } else {
        ctx.fillStyle = "#c59a62"; ctx.strokeStyle = "#5a3a12";
        ctx.beginPath(); ctx.roundRect(x - 22, y - 26, 28, 26, 3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#e6c48c"; ctx.fillRect(x - 12, y - 26, 8, 26);
        ctx.fillStyle = "#2b2f36"; ctx.strokeStyle = "#0f1114"; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.arc(x + 18, y - 14, 14, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#7c8794"; ctx.beginPath(); ctx.arc(x + 18, y - 14, 5.5, 0, 6.3); ctx.fill();
      }
    }
    function drawDumpBack(p) {
      mound(p.x + 130, 380, 160, p.y, "#8d7f6a", "#4d4336", 101, 70);
      mound(p.x + 560, 440, 200, p.y, "#7e705b", "#4d4336", 203, 90);
      // placa
      const sx = p.x + 330, sy = p.y;
      ctx.fillStyle = "#8a5a2b"; ctx.strokeStyle = "#4a2d12"; ctx.lineWidth = 3;
      ctx.fillRect(sx + 10, sy - 36, 8, 36); ctx.strokeRect(sx + 10, sy - 36, 8, 36);
      ctx.fillRect(sx + 80, sy - 36, 8, 36); ctx.strokeRect(sx + 80, sy - 36, 8, 36);
      const g = ctx.createLinearGradient(0, sy - 90, 0, sy - 30); g.addColorStop(0, "#d9a066"); g.addColorStop(1, "#b97a43");
      ctx.fillStyle = g; rr(sx - 4, sy - 92, 106, 58, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "800 16px 'Baloo 2','Trebuchet MS',sans-serif"; ctx.textAlign = "center";
      ctx.fillText("ATERRO", sx + 49, sy - 66); ctx.fillText("A CÉU ABERTO", sx + 49, sy - 46); ctx.textAlign = "left";
      // fumaça de um monte
      for (let k = 0; k < 4; k++) {
        const t = (globalTick * 0.6 + k * 50) % 200;
        ctx.fillStyle = `rgba(70,66,60,${0.6 * (1 - t / 200)})`;
        ctx.beginPath(); ctx.arc(p.x + 560 + Math.sin(k) * 10 + t * 0.2, p.y - 170 - t, 14 + t * 0.12, 0, 6.3); ctx.fill();
      }
    }

    // ---------- Fase 5: rio, redes e barco ----------
    const FISH_COLS = [["#ff8a3d", "#e8590c"], ["#4cc9f0", "#1d7fb8"], ["#ffd166", "#e0a100"], ["#ff7aa2", "#d6336c"]];

    function drawFish(x, y, s, col, dir) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
      ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#12354f";
      ctx.fillStyle = col[1];
      ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-26, -11); ctx.lineTo(-22, 0); ctx.lineTo(-26, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col[0];
      ctx.beginPath(); ctx.ellipse(0, 0, 18, 12, 0, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(2, 5, 12, 5, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = col[1];
      ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(2, -19); ctx.lineTo(9, -10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(10, -3, 4, 0, 6.3); ctx.fill(); ctx.lineWidth = 1.8; ctx.stroke();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(11, -3, 1.8, 0, 6.3); ctx.fill();
      ctx.restore();
    }
    function drawTurtle(x, y, s) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#173d24";
      ctx.fillStyle = "#8fd14f";
      [[-13, 9], [10, 9]].forEach(([lx, ly]) => { ctx.beginPath(); ctx.roundRect(lx - 5, ly, 10, 9, 4); ctx.fill(); ctx.stroke(); });
      ctx.beginPath(); ctx.ellipse(21, 0, 9, 8, 0, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(24, -2, 2.6, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(25, -2, 1.3, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#4a9a3a"; ctx.beginPath(); ctx.arc(0, 8, 22, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#2c6a26"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-12, 8); ctx.lineTo(-8, -6); ctx.moveTo(0, 8); ctx.lineTo(0, -12); ctx.moveTo(12, 8); ctx.lineTo(8, -6); ctx.moveTo(-14, -2); ctx.lineTo(14, -2); ctx.stroke();
      ctx.restore();
    }
    function drawDuck(x, y, s, flap) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#7a4a00";
      ctx.fillStyle = "#ffd84d"; ctx.beginPath(); ctx.ellipse(0, 6, 17, 12, 0, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, -9, 10, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ff8a1f"; ctx.beginPath(); ctx.moveTo(19, -10); ctx.lineTo(29, -7); ctx.lineTo(19, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(13, -11, 2, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#f2b705"; ctx.beginPath(); ctx.ellipse(-4, 4 + flap * 4, 10, 6, -0.4 + flap * 0.5, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function meshFill(pathFn, x0, y0, x1, y1, step, alpha) {
      ctx.save(); pathFn(); ctx.clip();
      ctx.strokeStyle = `rgba(240,228,175,${alpha})`; ctx.lineWidth = 1.8;
      const h = y1 - y0;
      ctx.beginPath();
      for (let i = -h; i < x1 - x0; i += step) {
        ctx.moveTo(x0 + i, y0); ctx.lineTo(x0 + i + h, y1);
        ctx.moveTo(x0 + i + h, y0); ctx.lineTo(x0 + i, y1);
      }
      ctx.stroke(); ctx.restore();
    }
    function drawNetPoles(L, R, T, B) {
      ctx.lineCap = "round";
      ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(L, T - 8); ctx.lineTo(L, B + 3); ctx.moveTo(R, T - 8); ctx.lineTo(R, B + 3); ctx.stroke();
      ctx.strokeStyle = "#b9763f"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(L, T - 8); ctx.lineTo(L, B + 3); ctx.moveTo(R, T - 8); ctx.lineTo(R, B + 3); ctx.stroke();
    }
    function drawNetFloats(L, R, T) {
      for (let i = 0; i < 5; i++) {
        const fx = L + 6 + i * ((R - L - 12) / 4);
        ctx.fillStyle = i % 2 ? "#ff7a1a" : "#ffb703"; ctx.strokeStyle = "#7a3b00"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(fx, T, 5.5, 0, 6.3); ctx.fill(); ctx.stroke();
      }
    }
    function drawNetItem(it) {
      const x = it.x + Math.sin(globalTick * 0.05 + it.x) * 1.5, y = it.y;
      const L = x - 36, R = x + 36, T = y - 36, B = y + 34;
      ctx.lineJoin = "round";
      drawNetPoles(L, R, T, B);
      // animal preso (atrás da rede)
      const wig = Math.sin(globalTick * 0.1 + it.x) * 0.12;
      ctx.save(); ctx.translate(x, y + 6); ctx.rotate(wig);
      if (it.animal === 'fish') drawFish(0, 0, 1.25, it.col, 1);
      else if (it.animal === 'turtle') drawTurtle(-4, -2, 1);
      else drawDuck(0, 0, 1.1, 0);
      ctx.restore();
      const shape = () => {
        ctx.beginPath(); ctx.moveTo(L + 2, T);
        ctx.bezierCurveTo(L - 4, T + 40, x - 24, B + 6, x, B + 8);
        ctx.bezierCurveTo(x + 24, B + 6, R + 4, T + 40, R - 2, T);
        ctx.closePath();
      };
      ctx.fillStyle = "rgba(235,225,175,.08)"; shape(); ctx.fill();
      meshFill(shape, L - 6, T, R + 6, B + 10, 13, 0.5);
      ctx.strokeStyle = "#f3e7b5"; ctx.lineWidth = 3; shape(); ctx.stroke();
      ctx.fillStyle = "#6c757d"; ctx.beginPath(); ctx.arc(x - 12, B + 5, 3, 0, 6.3); ctx.arc(x + 12, B + 5, 3, 0, 6.3); ctx.fill();
      drawNetFloats(L, R, T);
      // dica: tesoura
      ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#fff";
      ctx.fillText("✂️", x, T - 18 + Math.sin(globalTick * 0.1) * 3); ctx.textAlign = "left";
    }
    function drawNetRemains(it) {
      const x = it.x, y = it.y, L = x - 36, R = x + 36, T = y - 36, B = y + 34;
      drawNetPoles(L, R, T, B);
      ctx.strokeStyle = "#e6d6a0"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
      for (let i = 0; i < 5; i++) { const fx = L + 8 + i * 14.5; ctx.beginPath(); ctx.moveTo(fx, T); ctx.lineTo(fx + (i % 2 ? 3 : -3), T + 12 + (i * 7) % 16); ctx.stroke(); }
      drawNetFloats(L, R, T);
    }

    function drawBoat(p) {
      const x = p.x, y = p.y, w = p.w, bot = y + 104;
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      const hull = () => {
        ctx.beginPath();
        ctx.moveTo(x - 44, y - 26);
        ctx.quadraticCurveTo(x - 22, y - 2, x + 22, y);
        ctx.lineTo(x + w - 10, y);
        ctx.lineTo(x + w + 14, y - 16);
        ctx.quadraticCurveTo(x + w + 8, y + 62, x + w - 70, bot);
        ctx.lineTo(x + 80, bot);
        ctx.quadraticCurveTo(x - 6, y + 56, x - 44, y - 26);
        ctx.closePath();
      };
      const hg = ctx.createLinearGradient(0, y, 0, bot); hg.addColorStop(0, "#c98a4e"); hg.addColorStop(1, "#7d4d24");
      ctx.fillStyle = hg; hull(); ctx.fill();
      ctx.save(); hull(); ctx.clip();
      ctx.fillStyle = "#2f78c4"; ctx.fillRect(x - 60, y + 8, w + 120, 14);
      ctx.strokeStyle = "rgba(60,32,10,.5)"; ctx.lineWidth = 2.5;
      for (let ly = y + 34; ly < bot; ly += 24) { ctx.beginPath(); ctx.moveTo(x - 60, ly); ctx.lineTo(x + w + 40, ly); ctx.stroke(); }
      ctx.restore();
      ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 4.5; hull(); ctx.stroke();
      // vigias
      for (let k = 0; k < 6; k++) {
        const px = x + 150 + k * 110; if (px > x + w - 90) break;
        ctx.fillStyle = "#bfe6f2"; ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.arc(px, y + 52, 11, 0, 6.3); ctx.fill(); ctx.stroke();
      }
      // convés
      ctx.fillStyle = "#e6bd85"; ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 3.5; rr(x - 4, y - 5, w + 10, 13, 4); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(90,50,20,.55)"; ctx.lineWidth = 2;
      for (let px = x + 30; px < x + w; px += 46) { ctx.beginPath(); ctx.moveTo(px, y - 5); ctx.lineTo(px, y + 8); ctx.stroke(); }
      // pilha de rede
      const cx = x + w - 250, nx = cx - 100;
      const pile = () => { ctx.beginPath(); ctx.moveTo(nx - 62, y - 4); ctx.bezierCurveTo(nx - 62, y - 76, nx + 62, y - 76, nx + 62, y - 4); ctx.closePath(); };
      ctx.fillStyle = "#58784a"; pile(); ctx.fill();
      meshFill(pile, nx - 62, y - 62, nx + 62, y - 4, 12, 0.7);
      ctx.strokeStyle = "#2c3f25"; ctx.lineWidth = 3.5; pile(); ctx.stroke();
      for (let i = 0; i < 5; i++) { const a = Math.PI * (0.15 + i * 0.175); const fx = nx - Math.cos(a) * 56, fy = y - 4 - Math.sin(a) * 58; ctx.fillStyle = i % 2 ? "#ff7a1a" : "#ffb703"; ctx.strokeStyle = "#7a3b00"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(fx, fy, 6, 0, 6.3); ctx.fill(); ctx.stroke(); }
      // cabine
      ctx.fillStyle = "#f2ead6"; ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 4; rr(cx, y - 132, 160, 127, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#c0392b"; rr(cx - 10, y - 150, 180, 20, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#bfe6f2"; rr(cx + 16, y - 106, 50, 42, 6); ctx.fill(); ctx.stroke(); rr(cx + 92, y - 106, 50, 42, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.6)"; rr(cx + 22, y - 100, 12, 10, 2); ctx.fill();
      ctx.fillStyle = "#8a5a2b"; ctx.strokeStyle = "#3a230d"; rr(cx + 66, y - 56, 28, 51, 4); ctx.fill(); ctx.stroke();
      // mastro e bandeira pirata
      const mx = cx + 80;
      ctx.strokeStyle = "#5a3214"; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(mx, y - 150); ctx.lineTo(mx, y - 262); ctx.stroke();
      ctx.fillStyle = "#14161a"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
      const fl = Math.sin(globalTick * 0.08) * 3;
      ctx.beginPath(); ctx.moveTo(mx + 3, y - 258); ctx.lineTo(mx + 64, y - 246 + fl); ctx.lineTo(mx + 3, y - 226); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif"; ctx.fillText("☠", mx + 12, y - 235 + fl * 0.4);
      // caixa com peixes capturados
      const bx = x + w - 70;
      ctx.fillStyle = "#c59a62"; ctx.strokeStyle = "#5a3a12"; ctx.lineWidth = 3.5; rr(bx, y - 38, 54, 34, 4); ctx.fill(); ctx.stroke();
      drawFish(bx + 18, y - 40, 0.55, FISH_COLS[3], 1); drawFish(bx + 38, y - 38, 0.5, FISH_COLS[1], -1);
    }

    function drawWaterLife() {
      const top = H - 44;
      for (let k = 0; k < 4; k++) {
        const T = 150, t = (globalTick + k * 97) % 420;
        if (t > T) continue;
        const u = t / T, bx = ((k * 0.27 + 0.1) * W + k * 53) % W;
        const x = bx + u * 120, y = top - Math.sin(Math.PI * u) * 55 + 6;
        const ang = Math.atan2(-Math.cos(Math.PI * u) * 55 * Math.PI, 120);
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang); drawFish(0, 0, 0.8, FISH_COLS[k % 4], 1); ctx.restore();
        if (u < 0.1 || u > 0.9) {
          const sx = u < 0.5 ? bx : bx + 120;
          ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(sx, top + 6, 8 + (u < 0.5 ? u : 1 - u) * 60, Math.PI, 0); ctx.stroke();
        }
      }
    }

    function drawWater() {
      const top = H - 44;
      const g = ctx.createLinearGradient(0, top, 0, H);
      if (currentLevel === 4) { g.addColorStop(0, "#9bd43a"); g.addColorStop(1, "#4d7a1c"); } else { g.addColorStop(0, "#35b6f0"); g.addColorStop(1, "#1a7fd1"); }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, top + Math.sin(x * 0.045 + globalTick * 0.06) * 5);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = currentLevel === 4 ? "rgba(226,255,150,.85)" : "rgba(255,255,255,.8)"; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x = 0; x <= W + 20; x += 20) { const yy = top + Math.sin(x * 0.045 + globalTick * 0.06) * 5; x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.7)";
      for (let x = 10; x <= W; x += 46) { const yy = top + Math.sin(x * 0.045 + globalTick * 0.06) * 5; ctx.beginPath(); ctx.arc(x, yy + 8 + ((x * 3) % 9), 2.5 + (x % 3), 0, 6.3); ctx.fill(); }
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= W + 20; x += 20) { const yy = top + 16 + Math.sin(x * 0.05 - globalTick * 0.05 + 2) * 4; x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
      ctx.stroke();
    }

    let errShown = false;
    function loop() {
      try { update(); draw(); }
      catch (err) {
        console.error(err);
        if (!errShown) { errShown = true; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, H - 60, W, 60); ctx.fillStyle = "#ff6b6b"; ctx.font = "14px monospace"; ctx.fillText("Erro: " + err.message, 10, H - 30); }
      }
      requestAnimationFrame(loop);
    }

    loadLevel(1);
    loop();
</script>
</body>
