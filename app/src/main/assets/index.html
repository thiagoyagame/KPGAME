<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KPGAME - Salve a Floresta!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        :root { --font: 'Baloo 2', 'Trebuchet MS', 'Comic Sans MS', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #48cae4; font-family: var(--font); }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* ---------- HUD ---------- */
        #hud {
          position: absolute; top: 0; left: 0; width: 100%;
          display: flex; justify-content: space-between; align-items: flex-start;
          padding: max(6px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left));
          z-index: 20; pointer-events: none; gap: 8px;
        }
        .hud-left, .hud-center, .hud-right { display: flex; align-items: center; gap: 8px; }
        .hud-center { margin-top: 4px; }

        .logo { position: relative; padding: 2px 6px 0 2px; }
        .logo .title {
          font-weight: 800; font-size: clamp(24px, 5.5vw, 54px); line-height: 1; letter-spacing: 1px;
          color: #ffb703; -webkit-text-stroke: clamp(3px, .6vw, 6px) #7b3f12; paint-order: stroke fill;
          text-shadow: 0 4px 0 #7b3f12, 0 6px 8px rgba(0,0,0,.35);
          background: linear-gradient(#ffe066, #ff9f1c); -webkit-background-clip: text; background-clip: text;
        }
        .logo .sub {
          margin-top: -4px; margin-left: clamp(10px, 3vw, 30px); display: inline-block;
          background: linear-gradient(#b9763f, #8a4f26); border: 3px solid #5a3214; border-radius: 10px;
          color: #fff; font-weight: 800; font-size: clamp(10px, 2.3vw, 20px); padding: 0 12px;
          text-shadow: 0 2px 0 #3d210c; box-shadow: 0 3px 0 #3d210c;
        }
        .heart { font-size: clamp(20px, 4vw, 36px); filter: drop-shadow(0 3px 0 rgba(120,0,20,.5)); }
        .heart.lost { filter: grayscale(1) brightness(.35) drop-shadow(0 3px 0 rgba(0,0,0,.4)); }

        .pill {
          display: flex; align-items: center; gap: 6px;
          background: rgba(18, 52, 82, 0.88); border: 2px solid #4aa3c7; border-radius: 14px;
          padding: 2px 10px 2px 8px; color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.3);
        }
        .pill .ico { font-size: clamp(20px, 4vw, 34px); }
        .pill .txt { display: flex; flex-direction: column; line-height: 1; align-items: center; }
        .pill .lbl { font-size: clamp(10px, 1.7vw, 15px); font-weight: 800; opacity: .95; }
        .pill .val { font-size: clamp(15px, 3vw, 28px); font-weight: 800; }

        .sign {
          background: linear-gradient(#c88a4f, #9a5e2d); border: 3px solid #5a3214; border-radius: 8px;
          padding: 2px 10px; color: #fff; font-weight: 800; line-height: 1; text-align: center;
          font-size: clamp(11px, 2.2vw, 20px); text-shadow: 0 2px 0 #3d210c; box-shadow: 0 3px 0 #3d210c;
          display: flex; align-items: center; gap: 6px;
        }
        .sign .ico { font-size: clamp(18px, 3.6vw, 32px); }
        #btn-pause {
          pointer-events: auto; width: clamp(38px, 6vw, 56px); height: clamp(38px, 6vw, 56px);
          background: linear-gradient(#ffd23f, #ff9f1c); border: 3px solid #b45f06; border-radius: 14px;
          box-shadow: 0 4px 0 #8a4604, 0 6px 8px rgba(0,0,0,.3);
          display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
        }
        #btn-pause i { display: block; width: 24%; height: 52%; background: #fff; border-radius: 3px; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
        #btn-pause:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a4604; }

        /* ---------- Controles de toque ---------- */
        .touch-controls {
          position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 0; width: 100%;
          display: flex; justify-content: space-between;
          padding: 0 max(22px, env(safe-area-inset-right)) 0 max(22px, env(safe-area-inset-left));
          pointer-events: none; z-index: 15;
        }
        .dpad, .actions { display: flex; gap: 14px; pointer-events: auto; }
        .t-btn {
          width: clamp(60px, 8.5vw, 88px); height: clamp(60px, 8.5vw, 88px); border-radius: 50%;
          background: radial-gradient(circle at 35% 30%, #8cf04a, #3bb82a 70%);
          border: 5px solid #1f8a1f; box-shadow: 0 5px 0 #146414, 0 8px 12px rgba(0,0,0,.3);
          display: flex; align-items: center; justify-content: center; touch-action: none;
        }
        .t-btn svg { width: 48%; height: 48%; filter: drop-shadow(0 3px 0 rgba(0,70,0,.4)); }
        .t-btn:active { transform: translateY(4px) scale(.96); box-shadow: 0 1px 0 #146414; }

        .hidden { display: none !important; }
        #hud { flex-wrap: nowrap; }
        #hud-lives { display: flex; white-space: nowrap; flex-shrink: 0; }
        .hud-center, .hud-right, .pill, .sign { flex-shrink: 0; white-space: nowrap; }
        @media (max-width: 600px) { .hud-center .pill:nth-child(4) { display: none; } }

        @media (max-height: 520px), (max-width: 780px) {
          #hud { padding: max(4px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left)); gap: 5px; }
          .hud-left, .hud-center, .hud-right { gap: 5px; }
          .hud-center { margin-top: 0; }
          #hud .logo .title { font-size: 26px; -webkit-text-stroke: 3px #7b3f12; text-shadow: 0 2px 0 #7b3f12; }
          #hud .logo .sub { display: none; }
          .heart { font-size: 18px; }
          .pill { padding: 1px 8px 1px 6px; border-width: 2px; border-radius: 10px; background: rgba(18, 52, 82, .82); gap: 4px; }
          .pill .ico { font-size: 18px; }
          .pill .lbl { font-size: 9px; }
          .pill .val { font-size: 14px; }
          .sign { padding: 1px 8px; font-size: 10px; border-width: 2px; }
          .sign .ico { font-size: 16px; }
          #btn-pause { width: 32px; height: 32px; border-width: 2px; border-radius: 9px; gap: 4px; }
        }

        /* ---------- Tela de início ---------- */
        #start {
          position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(ellipse at center, rgba(10,40,70,.10) 0%, rgba(10,40,70,.55) 100%);
        }
        #start.hidden { display: none; }
        body.intro #hud, body.intro .touch-controls { display: none; }
        .start-box { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.8vh, 16px); text-align: center; padding: 10px; }
        .logo.big .title { font-size: clamp(50px, 13vw, 130px); -webkit-text-stroke: clamp(5px, 1vw, 10px) #7b3f12; text-shadow: 0 6px 0 #7b3f12, 0 10px 14px rgba(0,0,0,.4); }
        .logo.big .sub { font-size: clamp(15px, 3.2vw, 30px); margin-top: -6px; padding: 2px 20px; border-width: 4px; }
        .tagline { color: #fff; font-weight: 800; font-size: clamp(13px, 2.2vw, 20px); text-shadow: 0 2px 0 rgba(0,0,0,.55); }
        .play {
          font-family: var(--font); font-weight: 800; color: #fff; cursor: pointer; letter-spacing: 1px;
          font-size: clamp(22px, 4.5vw, 40px); padding: 4px clamp(28px, 5.5vw, 56px);
          background: radial-gradient(circle at 35% 25%, #8cf04a, #3bb82a 75%); border: 5px solid #1f8a1f; border-radius: 22px;
          box-shadow: 0 7px 0 #146414, 0 12px 18px rgba(0,0,0,.35); text-shadow: 0 3px 0 rgba(0,70,0,.55);
          animation: pulse 1.4s ease-in-out infinite;
        }
        .play:active { transform: translateY(5px); box-shadow: 0 2px 0 #146414; animation: none; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        .lvls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; color: #fff; font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,.55); font-size: clamp(12px, 1.9vw, 17px); }
        .lvls button {
          font-family: var(--font); font-weight: 800; font-size: clamp(12px, 1.9vw, 17px); color: #fff; cursor: pointer;
          background: linear-gradient(#c88a4f, #9a5e2d); border: 3px solid #5a3214; border-radius: 10px; padding: 1px 11px;
          box-shadow: 0 3px 0 #3d210c; text-shadow: 0 2px 0 #3d210c;
        }
        .lvls button.active-lang { outline: 3px solid #ffe066; }
        .lvls button:active { transform: translateY(2px); box-shadow: 0 1px 0 #3d210c; }
        .how { color: #fff; font-weight: 600; font-size: clamp(11px, 1.7vw, 15px); text-shadow: 0 2px 0 rgba(0,0,0,.6); background: rgba(10,30,50,.55); border-radius: 12px; padding: 4px 14px; }

        /* ---------- Ranking ---------- */
        #rank { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(10, 30, 50, .72); overflow: auto; }
        #rank.hidden { display: none; }
        .rank-panel { min-width: min(92vw, 380px); max-width: 92vw; gap: 8px; margin: 10px; }
        .rank-panel h2 { font-size: clamp(22px, 4vw, 30px); }
        #rank-score { color: #ffe066; font-weight: 800; font-size: clamp(18px, 3.4vw, 26px); text-shadow: 0 2px 0 #3d210c; }
        #rank-msg { color: #fff; font-weight: 800; min-height: 1.2em; text-shadow: 0 2px 0 #3d210c; font-size: clamp(13px, 2.2vw, 17px); }
        #rank-form { display: flex; gap: 8px; justify-content: center; align-items: center; }
        #rank-name { font-family: var(--font); font-weight: 800; font-size: 18px; width: min(58vw, 250px); padding: 3px 10px; border-radius: 10px; border: 3px solid #5a3214; background: #fff7e6; color: #3d210c; outline: none; }
        #rank-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        #rank-list li { display: flex; align-items: center; gap: 10px; background: rgba(61, 33, 12, .55); border: 2px solid rgba(255,255,255,.18); border-radius: 12px; padding: 2px 10px; color: #fff; text-align: left; }
        #rank-list li.me { background: linear-gradient(#ffe066, #ffb703); border-color: #b45f06; color: #3d210c; }
        #rank-list li.empty { opacity: .55; }
        #rank-list .pos { font-weight: 800; font-size: 20px; width: 30px; text-align: center; }
        #rank-list .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 800; font-size: 16px; line-height: 1.05; display: flex; flex-direction: column; }
        #rank-list .nm small { font-weight: 600; font-size: 12px; opacity: .9; }
        #rank-list .sc { font-weight: 800; font-size: 18px; }
        .rank-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

        /* ---------- Menu de pausa ---------- */
        #menu {
          position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
          background: rgba(10, 30, 50, .6);
        }
        #menu.open { display: flex; }
        .panel {
          background: linear-gradient(#c88a4f, #9a5e2d); border: 5px solid #5a3214; border-radius: 18px;
          padding: 18px 26px; display: flex; flex-direction: column; gap: 10px; min-width: 250px;
          box-shadow: 0 8px 0 #3d210c, 0 14px 30px rgba(0,0,0,.4); text-align: center;
        }
        .panel h2 { color: #fff; font-size: 30px; text-shadow: 0 3px 0 #3d210c; }
        .panel button {
          font-family: var(--font); font-weight: 800; font-size: 19px; color: #fff; cursor: pointer;
          background: linear-gradient(#8cf04a, #3bb82a); border: 3px solid #1f8a1f; border-radius: 12px;
          padding: 4px 14px; box-shadow: 0 4px 0 #146414; text-shadow: 0 2px 0 rgba(0,70,0,.5);
        }
        .panel button:active { transform: translateY(3px); box-shadow: 0 1px 0 #146414; }
        @media (max-height: 520px) {
          #menu .panel, .rank-panel { padding: 8px 14px; gap: 5px; max-height: 96vh; overflow: auto; }
          .panel h2 { font-size: 20px; }
          .panel button { font-size: 14px; padding: 1px 10px; }
          #menu .panel { display: grid; grid-template-columns: 1fr 1fr; }
          #menu .panel h2 { grid-column: 1 / -1; }
        }
        @media (max-height: 440px) { .tagline, .how { display: none; } .logo.big .title { font-size: 48px; } .logo.big .sub { font-size: 14px; } }
    </style>
</head>
<body class="intro">

<div id="start">
    <div class="start-box">
        <div class="logo big"><div class="title">KPGAME</div><div class="sub">Salve a Floresta!</div></div>
        <div class="tagline">Ajude a capivara a limpar a natureza!</div>
        <button class="play" onclick="startGame(1)">▶ JOGAR</button>
        <div class="lvls" id="stage-bar">
            <span id="lbl-stages">Fases:</span>
            <button onclick="startGame(1)">🌳 1</button>
            <button onclick="startGame(2)">🪵 2</button>
            <button onclick="startGame(3)">🦅 3</button>
            <button onclick="startGame(4)">🗑️ 4</button>
            <button onclick="startGame(5)">🎣 5</button>
            <button id="btn-rank-start" onclick="showRanking('view')">🏆 Ranking</button>
        </div>
        <div class="how">← → andar &nbsp;·&nbsp; Espaço / ▲ pular &nbsp;·&nbsp; P pausar</div>
        <div class="lvls" id="lang-bar">
            <button id="lang-pt" onclick="setLang('pt')">🇧🇷 PT</button>
            <button id="lang-en" onclick="setLang('en')">🇺🇸 EN</button>
            <button id="lang-es" onclick="setLang('es')">🇪🇸 ES</button>
        </div>
    </div>
</div>

<div id="hud">
    <div class="hud-left">
        <div class="logo">
            <div class="title">KPGAME</div>
            <div class="sub">Salve a Floresta!</div>
        </div>
    </div>
    <div class="hud-center">
        <div id="hud-lives"></div>
        <div class="pill" id="pill-trash"><span class="ico" id="trash-ico">♻️</span><span class="txt"><span class="lbl" id="trash-lbl">Lixo:</span><span class="val" id="trash-val">0 / 6</span></span></div>
        <div class="pill"><span class="ico">⭐</span><span class="txt"><span class="lbl" id="score-lbl">Pontos:</span><span class="val" id="score-val">0</span></span></div>
        <div class="pill"><span class="ico">🍊</span><span class="txt"><span class="lbl" id="fruit-lbl">Laranjas:</span><span class="val" id="fruit-val">0</span></span></div>
    </div>
    <div class="hud-right">
        <div class="sign"><span class="ico" id="lvl-ico">🌳</span><span><span id="lvl-num">Fase 1:</span><br><span class="nm" id="lvl-name">Rio</span></span></div>
        <div id="btn-pause" title="Pausar"><i></i><i></i></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<div class="touch-controls">
    <div class="dpad">
        <div class="t-btn" id="btn-left"><svg viewBox="0 0 24 24"><path d="M17 3 L5 12 L17 21 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
        <div class="t-btn" id="btn-right"><svg viewBox="0 0 24 24"><path d="M7 3 L19 12 L7 21 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="actions">
        <div class="t-btn" id="btn-jump"><svg viewBox="0 0 24 24"><path d="M3 17 L12 5 L21 17 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
    </div>
</div>

<div id="rank" class="hidden">
    <div class="panel rank-panel">
        <h2 id="rank-title">🏆 Ranking</h2>
        <div id="rank-score"></div>
        <div id="rank-form">
            <input id="rank-name" maxlength="20" placeholder="Seu nome" autocomplete="off" onkeydown="if(event.key==='Enter')submitScore()">
            <button onclick="submitScore()">💾 Salvar</button>
        </div>
        <div id="rank-msg"></div>
        <ol id="rank-list"></ol>
        <div class="rank-btns" id="rank-btns">
            <button id="btn-revive" class="hidden" onclick="reviveWithAd()">🎬 +1 ❤️ (Vídeo)</button>
            <button onclick="rankAgain()">🔄 Jogar de novo</button>
            <button onclick="rankHome()">🏠 Início</button>
        </div>
        <button id="rank-close" onclick="hideRanking()">Fechar</button>
    </div>
</div>

<div id="menu">
    <div class="panel">
        <h2>⏸ Pausado</h2>
        <button onclick="togglePause()">▶ Continuar</button>
        <button onclick="menuLevel(1)">🌳 Fase 1: Rio</button>
        <button onclick="menuLevel(2)">🪵 Fase 2: Mata</button>
        <button onclick="menuLevel(3)">🦅 Fase 3: Caça</button>
        <button onclick="menuLevel(4)">🗑️ Fase 4: Aterro</button>
        <button onclick="menuLevel(5)">🎣 Fase 5: Pesca</button>
        <button onclick="showRanking('view')">🏆 Ranking</button>
        <button onclick="goHome()">🏠 Início</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    let currentLevel = 1, started = false;

    function groundY() { return H - (H < 520 ? 84 : 100); }

    function resize() {
      const prevGY = groundY();
      W = window.innerWidth; H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = W * DPR; canvas.height = H * DPR;
      const newGY = groundY();
      const dy = newGY - prevGY;
      if (Math.abs(dy) > 2 && typeof platforms !== 'undefined' && platforms.length) {
        for (const p of platforms) p.y += dy;
        for (const it of items) it.y += dy;
        for (const t of traps) t.y += dy;
        for (const q of props) q.y += dy;
        if (cagedBird) cagedBird.y += dy;
        if (boss) boss.y += dy;
        if (capy) {
          capy.y = Math.min(newGY - capy.h, capy.y + dy);
          capy.safeY += dy;
        }
      }
    }
    window.addEventListener('resize', resize);

    // ================== MULTILINGUAGEM ==================
    const I18N = {
      pt: {
        sub: 'Salve a Floresta!', tagline: 'Ajude a capivara a limpar a natureza!', play: '▶ JOGAR',
        stages: 'Fases:', rank: '🏆 Ranking', how: '← → andar · Espaço / ▲ pular · P pausar',
        trash: 'Lixo:', animals: 'Animais:', saved: 'Salvos:', score: 'Pontos:', oranges: 'Laranjas:',
        stage: 'Fase', levels: { 1: 'Rio', 2: 'Mata', 3: 'Caça', 4: 'Aterro', 5: 'Pesca' },
        paused: '⏸ Pausado', resume: '▶ Continuar', home: '🏠 Início', help: 'Me ajude!', boss: 'CHEFE',
        sign: ['Mantenha', 'a floresta', 'limpa!'], dump: ['ATERRO', 'A CÉU ABERTO'],
        win: '🏆 Você salvou a floresta!', lose: '💀 Fim de jogo', pts: 'pontos',
        askName: 'Digite seu nome para entrar no ranking!', top5: 'Os 5 melhores jogadores',
        ph: 'Seu nome', save: '💾 Salvar', revive: '🎬 +1 ❤️ (Vídeo)', again: '🔄 Jogar de novo', close: 'Fechar',
        msgBottle: '♻️ Garrafa recolhida! Continue limpando o caminho!',
        msgCage: '🐾 Animal libertado da gaiola com sucesso!',
        msgRaccoon: '🦝 Guaxinim salvo! PULO DUPLO ativado!',
        msgHit: '💥 Ai! Perdeu um coração!',
        msgBossHit: (hp) => `💥 Atingido! Faltam ${hp} golpes!`,
        msgStageWin: (n) => `🎉 Vitória na Fase ${n}! Avançando...`,
        bosses: {
          1: { name: 'DONO DA FÁBRICA', text: 'Você acha que pode me deter? Ha haha ha!' },
          2: { name: 'LENHADOR', text: 'Nada vai me impedir de derrubar essa floresta!' },
          3: { name: 'CAÇADOR', text: 'Olha só! Mais um troféu pra levar pra casa!' },
          4: { name: 'DONO DO LIXÃO', text: 'Esse lixão será sua sepultura!! Ha ha ha ha ha!' },
          5: { name: 'PESCADOR PIRATA', text: 'Tá na hora de pescar uma Capivara!' }
        }
      },
      en: {
        sub: 'Save the Forest!', tagline: 'Help the capybara clean up nature!', play: '▶ PLAY',
        stages: 'Stages:', rank: '🏆 Ranking', how: '← → move · Space / ▲ jump · P pause',
        trash: 'Trash:', animals: 'Animals:', saved: 'Rescued:', score: 'Score:', oranges: 'Oranges:',
        stage: 'Stage', levels: { 1: 'River', 2: 'Woods', 3: 'Poachers', 4: 'Landfill', 5: 'Fishing' },
        paused: '⏸ Paused', resume: '▶ Resume', home: '🏠 Home', help: 'Help me!', boss: 'BOSS',
        sign: ['Keep', 'the forest', 'clean!'], dump: ['OPEN-AIR', 'LANDFILL'],
        win: '🏆 You saved the forest!', lose: '💀 Game Over', pts: 'points',
        askName: 'Enter your name to join the ranking!', top5: 'Top 5 players',
        ph: 'Your name', save: '💾 Save', revive: '🎬 +1 ❤️ (Ad)', again: '🔄 Play again', close: 'Close',
        msgBottle: '♻️ Bottle collected! Keep cleaning the path!',
        msgCage: '🐾 Animal freed from the cage!',
        msgRaccoon: '🦝 Raccoon saved! DOUBLE JUMP unlocked!',
        msgHit: '💥 Ouch! Lost a heart!',
        msgBossHit: (hp) => `💥 Hit! ${hp} hits left!`,
        msgStageWin: (n) => `🎉 Stage ${n} clear! Moving on...`,
        bosses: {
          1: { name: 'FACTORY OWNER', text: 'You think you can stop me? Ha haha ha!' },

    function loadLevel(lvl) {
      initAudio();
      W = window.innerWidth; H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = W * DPR; canvas.height = H * DPR;
      if (levelTimeout) { clearTimeout(levelTimeout); levelTimeout = null; }
      currentLevel = lvl;
      const gY = groundY();
      const L = buildLevel(lvl, gY);
      platforms = L.platforms; items = L.items; traps = L.traps; props = L.props; boss = L.boss; cagedBird = L.cage;
      LEVELS[lvl].width = L.width;
      hasBird = lvl > 1; capy.maxJumps = lvl > 1 ? 2 : 1;
      trashCollected = 0; if (lvl === 1) fruitsCollected = 0;
      capy.x = 80; capy.y = gY - capy.h; capy.vx = 0; capy.vy = 0; capy.inWater = false;
      capy.safeX = 80; capy.safeY = gY - capy.h; capy.invuln = 0; capy.grounded = true;
      cameraX = 0; cameraY = 0; barrels = []; particles = []; popups = []; freedAnimals = []; gameOver = false; gameWon = false;
      animalsFreed = 0;
      items.forEach(i => i.collected = false);

      const NODECO = { falling: 1, boat: 1, treetop: 1, raft: 1, dock: 1 };
      platforms.forEach((p, pi) => {
        p.deco = [];
        if (NODECO[p.type]) return;
        const n = Math.floor(p.w / 120);
        for (let k = 0; k < n; k++) {
          const dx = p.x + 50 + k * 120 + rnd(pi * 31 + k) * 50;
          if (dx > p.x + p.w - 40) continue;
          p.deco.push({ x: dx, kind: rnd(pi * 7 + k * 3) > 0.45 ? 'flower' : 'bush', c: Math.floor(rnd(pi + k) * 3) });
        }
      });
      updateHUD();
    }

    function loseLife() {
      if (capy.invuln > 0 || gameOver || gameWon) return;
      SFX.hit(); lives--; updateHUD();
      if (lives <= 0) {
        gameOver = true; msgBanner = ""; msgTimer = 0; endGame(false);
      } else {
        capy.x = capy.safeX; capy.y = capy.safeY - 15; capy.vy = -4.5; capy.invuln = 75;
        msgBanner = T().msgHit; msgTimer = 110;
      }
    }

    function doJump() {
      initAudio();
      if (paused || !started || AdBridge.active) return;
      if (boss && !boss.defeated && boss.state === 'talk') { if (boss.talkT > 24) boss.talkT = 99999; return; }
      if (gameOver || gameWon) return;
      if (capy.inWater) {
        SFX.jump(); capy.vy = SWIM_JUMP_V; capy.jumps = 1; capy.inWater = false; capy.grounded = false; capy.waterGrace = 10;
        spawnParticles(capy.x + 23, H - 44, "#d6f1ff", 10);
        return;
      }
      if (capy.grounded) {
        SFX.jump(); capy.vy = JUMP_V; capy.grounded = false; capy.jumps = 1;
        spawnParticles(capy.x + 14, capy.y + capy.h, "#ffffff", 5);
      } else if (capy.jumps < capy.maxJumps) {
        SFX.jump(); capy.vy = DOUBLE_JUMP_V; capy.jumps++;
        spawnParticles(capy.x + 20, capy.y + 50, "#caf0f8", 8);
      }
    }

    // ================== ENTRADA ==================
    window.addEventListener('keydown', e => {
      if (e.target && e.target.tagName === 'INPUT') return;
      initAudio();
      if (!started) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); startGame(1); } return; }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) doJump(); }
      if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });
    function bindTouch(id, onDown, onUp) {
      const el = document.getElementById(id);
      const down = e => { e.preventDefault(); initAudio(); onDown(); };
      const up = e => { e.preventDefault(); if (onUp) onUp(); };
      el.addEventListener('touchstart', down, { passive: false });
      el.addEventListener('touchend', up, { passive: false });
      el.addEventListener('touchcancel', up, { passive: false });
      el.addEventListener('mousedown', down);
      el.addEventListener('mouseup', up);
      el.addEventListener('mouseleave', up);
    }
    bindTouch('btn-left', () => keys.left = true, () => keys.left = false);
    bindTouch('btn-right', () => keys.right = true, () => keys.right = false);
    bindTouch('btn-jump', () => doJump(), null);
    canvas.addEventListener('pointerdown', () => { if (gameOver || gameWon) doJump(); });

    // ================== ATUALIZAÇÃO ==================
    function update() {
      if (!started) {
        globalTick++;
        const gi = groundY() - capy.h, hop = Math.abs(Math.sin(globalTick * 0.07)) * 30;
        capy.x = Math.min(80, W * 0.08); capy.y = gi - hop; capy.dir = 1; capy.air = hop > 4 ? 10 : 0; capy.grounded = hop <= 4;
        return;
      }
      if (paused) return;
      globalTick++;
      updateMusic();
      if (msgTimer > 0 && !gameOver && !gameWon) msgTimer--;
      if (capy.invuln > 0) capy.invuln--;
      if (gameOver || gameWon) return;

      const tr = T();
      const talking = !!(boss && !boss.defeated && boss.state === 'talk');
      const spd = capy.inWater ? 1.6 : 2.0;
      if (talking) { capy.vx = 0; capy.animTick = 0; }
      else if (keys.left) { capy.vx = -spd; capy.dir = -1; capy.animTick += 0.11; }
      else if (keys.right) { capy.vx = spd; capy.dir = 1; capy.animTick += 0.11; }
      else { capy.vx *= 0.72; capy.animTick = capy.inWater ? capy.animTick + 0.07 : 0; }

      const prevX = capy.x;
      capy.x += capy.vx;
      if (capy.x < 0) capy.x = 0;
      const maxX = LEVELS[currentLevel].width - capy.w;
      if (capy.x > maxX) capy.x = maxX;
      for (const p of platforms) {
        if (!SOLID[p.type]) continue;
        const bottom = p.type === 'boat' ? p.y + 100 : H;
        if (capy.y + capy.h > p.y + 24 && capy.y < bottom && capy.x + capy.w - 6 > p.x && capy.x + 6 < p.x + p.w) {
          capy.x = (prevX + capy.w / 2 < p.x + p.w / 2) ? p.x - capy.w + 6 : p.x + p.w - 6;
          capy.vx = 0;
        }
      }

      capy.vy = Math.min(capy.vy + GRAVITY, MAX_FALL);
      const prevBottom = capy.y + capy.h;
      capy.y += capy.vy;
      capy.grounded = false;

      for (const p of platforms) {
        if (p.type === 'falling' && p.triggered && p.dropTimer > 0) { p.dropTimer--; p.y += 0.4; }
      }
      for (const p of platforms) {
        if (p.x > cameraX + W + 60 || p.x + p.w < cameraX - 60) continue;
        if (p.type === 'falling' && p.triggered && p.dropTimer <= 0) continue;
        if (capy.x + capy.w - 6 > p.x && capy.x + 6 < p.x + p.w) {
          if (capy.vy >= 0 && prevBottom <= p.y + 14 && capy.y + capy.h >= p.y - 3) {
            capy.y = p.y - capy.h; capy.vy = 0; capy.grounded = true; capy.jumps = 0;
            if (p.type !== 'falling') {
              capy.safeX = Math.max(p.x + 12, Math.min(capy.x, p.x + p.w - capy.w - 12));
              capy.safeY = p.y - capy.h;
            }
            if (p.type === 'falling' && !p.triggered) { p.triggered = true; p.dropTimer = 220; }
          }
        }
      }

      capy.air = capy.grounded ? 0 : capy.air + 1;
      for (const t of traps) {
        if (Math.abs((capy.x + 23) - t.x) < 24 && Math.abs((capy.y + 29) - t.y) < 24) loseLife();
      }

      const waterLevel = H - 40, wasInWater = capy.inWater;
      const inLiquid = !capy.grounded && capy.y + capy.h >= waterLevel;
      if (inLiquid && currentLevel === 4) {
        capy.inWater = false;
        spawnParticles(capy.x + capy.w / 2, waterLevel, "#a6e22e", 18); SFX.splash();
        if (capy.invuln > 0) { capy.x = capy.safeX; capy.y = capy.safeY - 15; capy.vy = -6; capy.vx = 0; }
        else loseLife();
      } else capy.inWater = inLiquid;
      if (capy.inWater) {
        if (!wasInWater) { SFX.splash(); spawnParticles(capy.x + capy.w / 2, H - 44, "#d6f1ff", 16); }
        capy.jumps = 0;
        if (capy.waterGrace > 0) capy.waterGrace--;
        else { capy.vy += ((H - 44) - (capy.y + capy.h)) * 0.02; capy.vy *= 0.85; }
        if (globalTick % 14 === 0) spawnParticles(capy.x + capy.w / 2, H - 44, "#d6f1ff", 2);
      }

      for (const it of items) {
        if (!it.collected && Math.abs((capy.x + 23) - it.x) < 34 && Math.abs((capy.y + 29) - it.y) < 38) {
          it.collected = true;
          if (it.kind === 'heart') {
            SFX.heart(); spawnParticles(it.x, it.y, "#ff4d6d", 14);
            if (lives < 3) { lives++; popups.push({ x: it.x, y: it.y - 10, text: '+❤', life: 60 }); updateHUD(); }
            else addScore(150, it.x, it.y - 10);
            continue;
          }
          if (it.kind === 'coin') { SFX.coin(); spawnParticles(it.x, it.y, "#ffd23f", 8); addScore(10, it.x, it.y); continue; }
          if (it.kind === 'net') {
            SFX.collect(); animalsFreed++;
            spawnParticles(it.x, it.y, "#e6d6a0", 18); spawnParticles(it.x, it.y, "#bde9ff", 8);
            addScore(150, it.x, it.y - 30);
            freedAnimals.push({ kind: it.animal, col: it.col, x: it.x, y: it.y, vx: 1.6 + Math.random() * 1.2, vy: -7.5 - Math.random() * 2, t: 0 });
            updateHUD(); continue;
          }
          SFX.collect();
          if (it.kind === 'tangerine') { fruitsCollected++; spawnParticles(it.x, it.y, "#ff9f1c", 10); addScore(50, it.x, it.y); }
          else if (it.kind === 'cage') {
            fruitsCollected += 2; animalsFreed++; addScore(200, it.x, it.y - 20);
            spawnParticles(it.x, it.y, "#00b4d8", 15);
            msgBanner = tr.msgCage; msgTimer = 160;
          } else {
            trashCollected++; spawnParticles(it.x, it.y, "#80ed99", 10); addScore(100, it.x, it.y);
            if (it.first) { msgBanner = tr.msgBottle; msgTimer = 190; }
          }
          updateHUD();
        }
      }

      if (cagedBird && !cagedBird.freed) {
        if (Math.abs((capy.x + 23) - cagedBird.x) < 44 && Math.abs((capy.y + 29) - cagedBird.y) < 48) {
          cagedBird.freed = true; hasBird = true; capy.maxJumps = 2; animalsFreed++; addScore(200, cagedBird.x, cagedBird.y - 30);
          SFX.win(); spawnParticles(cagedBird.x, cagedBird.y, "#00b4d8", 14);
          updateHUD();
          msgBanner = tr.msgRaccoon; msgTimer = 240;
        }
      }

      if (boss && boss.defeated) boss.dead++;
      if (boss && !boss.defeated && boss.state === 'wait' && capy.x > boss.trigger) {
        boss.state = 'talk'; boss.talkT = 0; keys.left = keys.right = false; capy.vx = 0;
      }
      if (boss && !boss.defeated && boss.state === 'talk') {
        boss.talkT++;
        const txt = tr.bosses[currentLevel].text;
        if (boss.talkT % 3 === 0 && boss.talkT / 2.2 < txt.length) SFX.talk();
        if (boss.talkT > txt.length * 2.2 + 110) { boss.state = 'fight'; boss.timer = 80; }
      }
      if (boss && !boss.defeated && boss.state === 'fight') {
        boss.face = (capy.x + 23 < boss.x + 85) ? -1 : 1;
        const rage = 1 + (boss.maxHp - boss.hp) * 0.22;
        if (boss.vx !== 0) {
          boss.x += boss.vx * rage * boss.moveDir;
          if (boss.x > boss.startX + 300 || boss.x < boss.startX - 230) boss.moveDir *= -1;
        }
        if (boss.hitCooldown > 0) boss.hitCooldown--;
        boss.timer++;
        const gap = Math.max(80, 120 - (boss.maxHp - boss.hp) * 12);
        if (boss.timer % gap === 0) {
          const sp = (currentLevel === 3 ? -2.8 : (currentLevel === 4 ? -2.5 : (currentLevel === 5 ? -2.9 : -2.3))) * (1 + (boss.maxHp - boss.hp) * 0.1);
          const fc = boss.face, bx0 = fc < 0 ? boss.x - 15 : boss.x + 185;
          barrels.push({ x: bx0, y: boss.y + boss.h - 60, vx: sp * -fc, rot: 0 });
          if (boss.hp <= 2 && boss.timer % (gap * 2) === 0) barrels.push({ x: bx0, y: boss.y + boss.h - 60, vx: sp * -fc * 1.45, rot: 0 });
        }
        const headX = boss.x + (boss.face > 0 ? 55 : 25), headY = boss.y - 10, headW = 90, headH = 30;
        if (capy.vy > 0 && capy.x + capy.w > headX && capy.x < headX + headW &&
            capy.y + capy.h >= headY && capy.y + capy.h <= headY + headH + 18 && boss.hitCooldown === 0) {
          boss.hp--; boss.hitCooldown = 45; capy.vy = STOMP_V; addScore(150, capy.x, capy.y - 10);
          SFX.hit(); spawnParticles(headX + 45, headY, "#e63946", 14);
          if (boss.hp <= 0) {
            boss.defeated = true; barrels = []; SFX.win(); addScore(500, boss.x + 60, boss.y - 20);
            spawnParticles(boss.x + 85, boss.y + 60, "#52b788", 25);
            if (currentLevel < 5) {
              msgBanner = tr.msgStageWin(currentLevel); msgTimer = 220;
              const next = currentLevel + 1;
              levelTimeout = setTimeout(() => AdBridge.showInterstitial(() => loadLevel(next)), 2200);
            } else { gameWon = true; score += lives * 200; updateHUD(); endGame(true); }
          } else { msgBanner = tr.msgBossHit(boss.hp); msgTimer = 140; }
        }
      }

      for (let i = barrels.length - 1; i >= 0; i--) {
        const b = barrels[i];
        b.x += b.vx; b.rot -= 0.08 * Math.sign(b.vx || -1);
        if (!(boss && boss.defeated) && Math.abs((capy.x + 23) - b.x) < (currentLevel === 5 ? 40 : 28) && Math.abs((capy.y + 29) - b.y) < 28) loseLife();
        if (b.x < cameraX - 250 || b.x > cameraX + W + 250) barrels.splice(i, 1);
      }
      for (let i = freedAnimals.length - 1; i >= 0; i--) {
        const a = freedAnimals[i]; a.t++;
        if (a.kind === 'duck') { a.x += 2.4; a.y -= 1.6 + Math.sin(a.t * 0.2) * 0.5; }
        else {
          a.x += a.vx; a.vy += 0.3; a.y += a.vy;
          if (a.y > H - 46) { spawnParticles(a.x, H - 46, "#d6f1ff", 12); freedAnimals.splice(i, 1); continue; }
        }
        if (a.t > 200) freedAnimals.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) { const pu = popups[i]; pu.y -= 0.8; pu.life--; if (pu.life <= 0) popups.splice(i, 1); }
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      const maxScroll = Math.max(0, LEVELS[currentLevel].width - W);
      const targetCam = talking ? boss.x + 60 - W * 0.62 : capy.x - W * 0.32;
      cameraX += (Math.max(0, Math.min(maxScroll, targetCam)) - cameraX) * 0.1;
      const targetY = Math.max(-900, Math.min(0, capy.y - H * 0.5));
      cameraY += (targetY - cameraY) * 0.09;
    }

    // ================== DESENHO: cenário ==================
    function drawBackground() {
      const skies = {
        1: ["#3cb9e8", "#bdeefa"],
        2: ["#4cc3d9", "#d7f3c9"],
        3: ["#ff9e6d", "#ffe0a8"],
        4: ["#b9a877", "#efe3bf"],
        5: ["#3aa6c8", "#f3e6bf"]
      }[currentLevel];
      const sg = ctx.createLinearGradient(0, 0, 0, H);
      sg.addColorStop(0, skies[0]); sg.addColorStop(1, skies[1]);
      ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "rgba(255,240,150,.35)"; ctx.beginPath(); ctx.arc(W - 120, 90, 70, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#ffe066"; ctx.beginPath(); ctx.arc(W - 120, 90, 46, 0, 6.3); ctx.fill();

      const cOff = cameraX * 0.2;
      for (const c of clouds) {
        const cx = ((c.x - cOff) % 4400 + 4400) % 4400 - 200;
        ctx.fillStyle = currentLevel === 4 ? "#d4ccb8" : "#fff";
        ctx.beginPath();
        ctx.arc(cx, c.y, 26 * c.s, 0, 6.3); ctx.arc(cx + 26 * c.s, c.y - 14 * c.s, 34 * c.s, 0, 6.3);
        ctx.arc(cx + 54 * c.s, c.y, 26 * c.s, 0, 6.3); ctx.arc(cx + 80 * c.s, c.y + 4 * c.s, 20 * c.s, 0, 6.3);
        ctx.arc(cx - 20 * c.s, c.y + 6 * c.s, 18 * c.s, 0, 6.3);
        ctx.fill();
        ctx.fillStyle = "rgba(160,215,240,.4)";
        ctx.beginPath(); ctx.ellipse(cx + 30 * c.s, c.y + 20 * c.s, 50 * c.s, 8 * c.s, 0, 0, 6.3); ctx.fill();
      }

        ctx.restore();
      }

    }
    function drawDumpBack(p) {
      mound(p.x + 130, 380, 160, p.y, "#8d7f6a", "#4d4336", 101, 70);
      mound(p.x + 560, 440, 200, p.y, "#7e705b", "#4d4336", 203, 90);
      const sx = p.x + 330, sy = p.y;
      ctx.fillStyle = "#8a5a2b"; ctx.strokeStyle = "#4a2d12"; ctx.lineWidth = 3;
      ctx.fillRect(sx + 10, sy - 36, 8, 36); ctx.strokeRect(sx + 10, sy - 36, 8, 36);
      ctx.fillRect(sx + 80, sy - 36, 8, 36); ctx.strokeRect(sx + 80, sy - 36, 8, 36);
      const g = ctx.createLinearGradient(0, sy - 90, 0, sy - 30); g.addColorStop(0, "#d9a066"); g.addColorStop(1, "#b97a43");
      ctx.fillStyle = g; rr(sx - 4, sy - 92, 106, 58, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "800 16px 'Baloo 2','Trebuchet MS',sans-serif"; ctx.textAlign = "center";
      ctx.fillText(T().dump[0], sx + 49, sy - 66); ctx.fillText(T().dump[1], sx + 49, sy - 46); ctx.textAlign = "left";
      for (let k = 0; k < 4; k++) {
        const t = (globalTick * 0.6 + k * 50) % 200;
        ctx.fillStyle = `rgba(70,66,60,${0.6 * (1 - t / 200)})`;
        ctx.beginPath(); ctx.arc(p.x + 560 + Math.sin(k) * 10 + t * 0.2, p.y - 170 - t, 14 + t * 0.12, 0, 6.3); ctx.fill();
      }
    }

    const FISH_COLS = [["#ff8a3d", "#e8590c"], ["#4cc9f0", "#1d7fb8"], ["#ffd166", "#e0a100"], ["#ff7aa2", "#d6336c"]];

    function drawFish(x, y, s, col, dir) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
      ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#12354f";
      ctx.fillStyle = col[1];
      ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-26, -11); ctx.lineTo(-22, 0); ctx.lineTo(-26, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col[0];
      ctx.beginPath(); ctx.ellipse(0, 0, 18, 12, 0, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(2, 5, 12, 5, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = col[1];
      ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(2, -19); ctx.lineTo(9, -10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(10, -3, 4, 0, 6.3); ctx.fill(); ctx.lineWidth = 1.8; ctx.stroke();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(11, -3, 1.8, 0, 6.3); ctx.fill();
      ctx.restore();
    }
    function drawTurtle(x, y, s) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#173d24";
      ctx.fillStyle = "#8fd14f";
      [[-13, 9], [10, 9]].forEach(([lx, ly]) => { ctx.beginPath(); ctx.roundRect(lx - 5, ly, 10, 9, 4); ctx.fill(); ctx.stroke(); });
      ctx.beginPath(); ctx.ellipse(21, 0, 9, 8, 0, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(24, -2, 2.6, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(25, -2, 1.3, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#4a9a3a"; ctx.beginPath(); ctx.arc(0, 8, 22, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#2c6a26"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-12, 8); ctx.lineTo(-8, -6); ctx.moveTo(0, 8); ctx.lineTo(0, -12); ctx.moveTo(12, 8); ctx.lineTo(8, -6); ctx.moveTo(-14, -2); ctx.lineTo(14, -2); ctx.stroke();
      ctx.restore();
    }
    function drawDuck(x, y, s, flap) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "#7a4a00";
      ctx.fillStyle = "#ffd84d"; ctx.beginPath(); ctx.ellipse(0, 6, 17, 12, 0, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, -9, 10, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ff8a1f"; ctx.beginPath(); ctx.moveTo(19, -10); ctx.lineTo(29, -7); ctx.lineTo(19, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(13, -11, 2, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#f2b705"; ctx.beginPath(); ctx.ellipse(-4, 4 + flap * 4, 10, 6, -0.4 + flap * 0.5, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function meshFill(pathFn, x0, y0, x1, y1, step, alpha) {
      ctx.save(); pathFn(); ctx.clip();
      ctx.strokeStyle = `rgba(240,228,175,${alpha})`; ctx.lineWidth = 1.8;
      const h = y1 - y0;
      ctx.beginPath();
      for (let i = -h; i < x1 - x0; i += step) {
        ctx.moveTo(x0 + i, y0); ctx.lineTo(x0 + i + h, y1);
        ctx.moveTo(x0 + i + h, y0); ctx.lineTo(x0 + i, y1);
      }
      ctx.stroke(); ctx.restore();
    }
    function drawNetPoles(L, R, T, B) {
      ctx.lineCap = "round";
      ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(L, T - 8); ctx.lineTo(L, B + 3); ctx.moveTo(R, T - 8); ctx.lineTo(R, B + 3); ctx.stroke();
      ctx.strokeStyle = "#b9763f"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(L, T - 8); ctx.lineTo(L, B + 3); ctx.moveTo(R, T - 8); ctx.lineTo(R, B + 3); ctx.stroke();
    }
    function drawNetFloats(L, R, T) {
      for (let i = 0; i < 5; i++) {
        const fx = L + 6 + i * ((R - L - 12) / 4);
        ctx.fillStyle = i % 2 ? "#ff7a1a" : "#ffb703"; ctx.strokeStyle = "#7a3b00"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(fx, T, 5.5, 0, 6.3); ctx.fill(); ctx.stroke();
      }
    }
    function drawNetItem(it) {
      const x = it.x + Math.sin(globalTick * 0.05 + it.x) * 1.5, y = it.y;
      const L = x - 36, R = x + 36, T = y - 36, B = y + 34;
      ctx.lineJoin = "round";
      drawNetPoles(L, R, T, B);
      const wig = Math.sin(globalTick * 0.1 + it.x) * 0.12;
      ctx.save(); ctx.translate(x, y + 6); ctx.rotate(wig);
      if (it.animal === 'fish') drawFish(0, 0, 1.25, it.col, 1);
      else if (it.animal === 'turtle') drawTurtle(-4, -2, 1);
      else drawDuck(0, 0, 1.1, 0);
      ctx.restore();
      const shape = () => {
        ctx.beginPath(); ctx.moveTo(L + 2, T);
        ctx.bezierCurveTo(L - 4, T + 40, x - 24, B + 6, x, B + 8);
        ctx.bezierCurveTo(x + 24, B + 6, R + 4, T + 40, R - 2, T);
        ctx.closePath();
      };
      ctx.fillStyle = "rgba(235,225,175,.08)"; shape(); ctx.fill();
      meshFill(shape, L - 6, T, R + 6, B + 10, 13, 0.5);
      ctx.strokeStyle = "#f3e7b5"; ctx.lineWidth = 3; shape(); ctx.stroke();
      ctx.fillStyle = "#6c757d"; ctx.beginPath(); ctx.arc(x - 12, B + 5, 3, 0, 6.3); ctx.arc(x + 12, B + 5, 3, 0, 6.3); ctx.fill();
      drawNetFloats(L, R, T);
      ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#fff";
      ctx.fillText("✂️", x, T - 18 + Math.sin(globalTick * 0.1) * 3); ctx.textAlign = "left";
    }
    function drawNetRemains(it) {
      const x = it.x, y = it.y, L = x - 36, R = x + 36, T = y - 36, B = y + 34;
      drawNetPoles(L, R, T, B);
      ctx.strokeStyle = "#e6d6a0"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
      for (let i = 0; i < 5; i++) { const fx = L + 8 + i * 14.5; ctx.beginPath(); ctx.moveTo(fx, T); ctx.lineTo(fx + (i % 2 ? 3 : -3), T + 12 + (i * 7) % 16); ctx.stroke(); }
      drawNetFloats(L, R, T);
    }

    function drawBoat(p) {
      const x = p.x, y = p.y, w = p.w, bot = y + 104;
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      const hull = () => {
        ctx.beginPath();
        ctx.moveTo(x - 44, y - 26);
        ctx.quadraticCurveTo(x - 22, y - 2, x + 22, y);
        ctx.lineTo(x + w - 10, y);
        ctx.lineTo(x + w + 14, y - 16);
        ctx.quadraticCurveTo(x + w + 8, y + 62, x + w - 70, bot);
        ctx.lineTo(x + 80, bot);
        ctx.quadraticCurveTo(x - 6, y + 56, x - 44, y - 26);
        ctx.closePath();
      };
      const hg = ctx.createLinearGradient(0, y, 0, bot); hg.addColorStop(0, "#c98a4e"); hg.addColorStop(1, "#7d4d24");
      ctx.fillStyle = hg; hull(); ctx.fill();
      ctx.save(); hull(); ctx.clip();
      ctx.fillStyle = "#2f78c4"; ctx.fillRect(x - 60, y + 8, w + 120, 14);
      ctx.strokeStyle = "rgba(60,32,10,.5)"; ctx.lineWidth = 2.5;
      for (let ly = y + 34; ly < bot; ly += 24) { ctx.beginPath(); ctx.moveTo(x - 60, ly); ctx.lineTo(x + w + 40, ly); ctx.stroke(); }
      ctx.restore();
      ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 4.5; hull(); ctx.stroke();
      for (let k = 0; k < 6; k++) {
        const px = x + 150 + k * 110; if (px > x + w - 90) break;
        ctx.fillStyle = "#bfe6f2"; ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.arc(px, y + 52, 11, 0, 6.3); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = "#e6bd85"; ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 3.5; rr(x - 4, y - 5, w + 10, 13, 4); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(90,50,20,.55)"; ctx.lineWidth = 2; for (let px = x + 30; px < x + w; px += 46) { ctx.beginPath(); ctx.moveTo(px, y - 5); ctx.lineTo(px, y + 8); ctx.stroke(); }
      const cx = x + w - 250, nx = cx - 100;
      const pile = () => { ctx.beginPath(); ctx.moveTo(nx - 62, y - 4); ctx.bezierCurveTo(nx - 62, y - 76, nx + 62, y - 76, nx + 62, y - 4); ctx.closePath(); };
      ctx.fillStyle = "#58784a"; pile(); ctx.fill();
      meshFill(pile, nx - 62, y - 62, nx + 62, y - 4, 12, 0.7);
      ctx.strokeStyle = "#2c3f25"; ctx.lineWidth = 3.5; pile(); ctx.stroke();
      for (let i = 0; i < 5; i++) { const a = Math.PI * (0.15 + i * 0.175); const fx = nx - Math.cos(a) * 56, fy = y - 4 - Math.sin(a) * 58; ctx.fillStyle = i % 2 ? "#ff7a1a" : "#ffb703"; ctx.strokeStyle = "#7a3b00"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(fx, fy, 6, 0, 6.3); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = "#f2ead6"; ctx.strokeStyle = "#3a230d"; ctx.lineWidth = 4; rr(cx, y - 132, 160, 127, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#c0392b"; rr(cx - 10, y - 150, 180, 20, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#bfe6f2"; rr(cx + 16, y - 106, 50, 42, 6); ctx.fill(); ctx.stroke(); rr(cx + 92, y - 106, 50, 42, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.6)"; rr(cx + 22, y - 100, 12, 10, 2); ctx.fill();
      ctx.fillStyle = "#8a5a2b"; ctx.strokeStyle = "#3a230d"; rr(cx + 66, y - 56, 28, 51, 4); ctx.fill(); ctx.stroke();
      const mx = cx + 80;
      ctx.strokeStyle = "#5a3214"; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(mx, y - 150); ctx.lineTo(mx, y - 262); ctx.stroke();
      ctx.fillStyle = "#14161a"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
      const fl = Math.sin(globalTick * 0.08) * 3;
      ctx.beginPath(); ctx.moveTo(mx + 3, y - 258); ctx.lineTo(mx + 64, y - 246 + fl); ctx.lineTo(mx + 3, y - 226); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif"; ctx.fillText("☠", mx + 12, y - 235 + fl * 0.4);
      const bx = x + w - 70;
      ctx.fillStyle = "#c59a62"; ctx.strokeStyle = "#5a3a12"; ctx.lineWidth = 3.5; rr(bx, y - 38, 54, 34, 4); ctx.fill(); ctx.stroke();
      drawFish(bx + 18, y - 40, 0.55, FISH_COLS[3], 1); drawFish(bx + 38, y - 38, 0.5, FISH_COLS[1], -1);
    }

    function drawWaterLife() {
      const top = H - 44;
      for (let k = 0; k < 4; k++) {
        const T_DUR = 150, t = (globalTick + k * 97) % 420;
        if (t > T_DUR) continue;
        const u = t / T_DUR, bx = ((k * 0.27 + 0.1) * W + k * 53) % W;
        const x = bx + u * 120, y = top - Math.sin(Math.PI * u) * 55 + 6;
        const ang = Math.atan2(-Math.cos(Math.PI * u) * 55 * Math.PI, 120);
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang); drawFish(0, 0, 0.8, FISH_COLS[k % 4], 1); ctx.restore();
        if (u < 0.1 || u > 0.9) {
          const sx = u < 0.5 ? bx : bx + 120;
          ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(sx, top + 6, 8 + (u < 0.5 ? u : 1 - u) * 60, Math.PI, 0); ctx.stroke();
        }
      }
    }

    function drawWater() {
      const top = H - 44;
      const g = ctx.createLinearGradient(0, top, 0, H);
      if (currentLevel === 4) { g.addColorStop(0, "#9bd43a"); g.addColorStop(1, "#4d7a1c"); } else { g.addColorStop(0, "#35b6f0"); g.addColorStop(1, "#1a7fd1"); }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, top + Math.sin(x * 0.045 + globalTick * 0.06) * 5);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = currentLevel === 4 ? "rgba(226,255,150,.85)" : "rgba(255,255,255,.8)"; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x = 0; x <= W + 20; x += 20) { const yy = top + Math.sin(x * 0.045 + globalTick * 0.06) * 5; x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.7)";
      for (let x = 10; x <= W; x += 46) { const yy = top + Math.sin(x * 0.045 + globalTick * 0.06) * 5; ctx.beginPath(); ctx.arc(x, yy + 8 + ((x * 3) % 9), 2.5 + (x % 3), 0, 6.3); ctx.fill(); }
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= W + 20; x += 20) { const yy = top + 16 + Math.sin(x * 0.05 - globalTick * 0.05 + 2) * 4; x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
      ctx.stroke();
    }

    let errShown = false;
    function loop() {
      try { update(); draw(); }
      catch (err) {
        console.error(err);
        if (!errShown) { errShown = true; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, H - 60, W, 60); ctx.fillStyle = "#ff6b6b"; ctx.font = "14px monospace"; ctx.fillText("Erro: " + err.message, 10, H - 30); }
      }
      requestAnimationFrame(loop);
    }

    loadLevel(1);
    applyLang();
    loop();
</script>
